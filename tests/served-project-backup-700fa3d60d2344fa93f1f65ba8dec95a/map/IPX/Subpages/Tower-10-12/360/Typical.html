<style>
@import url('https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap');

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Jost', sans-serif;
}

#viewer {
    width: 100%;
    height: 100%;
}

/* =========================================
   FADE
========================================= */

#fadeOverlay {
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity .45s ease;
    z-index: 99999;
}


/* =========================================
   BACK BUTTON
========================================= */

#backBtn {
    position: fixed;
    top: 24px;
    left: 24px;
    z-index: 10000;

    width: 46px;
    height: 46px;

    border: 1px solid rgba(255,255,255,.20);
    border-radius: 50%;

  background: rgba(30,48,43,.82);
    color: #fff;

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    box-shadow:
        0 8px 30px rgba(0,0,0,.25),
        inset 0 1px 0 rgba(255,255,255,.08);

    transition:
        background .25s ease,
        transform .25s ease,
        border-color .25s ease;
}

#backBtn:hover {
    background: rgba(255,255,255,.92);
    color: #111;
    border-color: rgba(255,255,255,.5);
    transform: translateX(-2px);
}

#backBtn svg {
    width: 19px;
    height: 19px;
}


/* =========================================
   ROOM INFORMATION
========================================= */


/* =========================================
   BOTTOM ROOM NAVIGATION
========================================= */

.tour-nav-wrap {
    position: fixed;

    left: 50%;
    bottom: 22px;

    transform: translateX(-50%);

    z-index: 10000;

    display: flex;
    align-items: center;

    width: auto;
    max-width: calc(100vw - 40px);
}

.tour-nav {
    display: flex;
    align-items: center;

    gap: 4px;

    padding: 7px;

    background: rgba(30,48,43,.82);

    border: 1px solid rgba(255,255,255,.16);
    border-radius: 18px;

    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);

    box-shadow:
        0 15px 50px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.07);

    overflow-x: auto;
    scrollbar-width: none;
}

.tour-nav::-webkit-scrollbar {
    display: none;
}


/* =========================================
   ROOM BUTTONS
========================================= */

.tour-pill {
    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 8px;

    height: 40px;
    padding: 0 15px;

    border: 1px solid transparent;
    border-radius: 12px;

    background: transparent;
    color: rgba(245,242,234,.68);

    font-family: 'Jost', sans-serif;
    font-size: 13px;
    font-weight: 600;

    letter-spacing: .025em;

    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;

    transition:
        background .25s ease,
        color .25s ease,
        transform .25s ease,
        border-color .25s ease;
}

.tour-pill svg {
    width: 16px;
    height: 16px;

    flex-shrink: 0;

    opacity: .72;

    transition:
        opacity .25s ease,
        transform .25s ease;
}

.tour-pill:hover {
    color: #fff;
    background: rgba(245,242,234,.10);

    transform: translateY(-1px);
}

.tour-pill:hover svg {
    opacity: 1;
}

.tour-pill.active {
    background: #E8E3D9;
    color: #1E302B;


    border-color: rgba(255,255,255,.5);

    box-shadow:
        0 5px 18px rgba(0,0,0,.2),
        inset 0 1px 0 rgba(255,255,255,.5);
}

.tour-pill.active svg {
    opacity: 1;
}
/* =========================================
   ROOM INFO — HIGH READABILITY VERSION
========================================= */

#roomInfoCard {
    box-sizing: border-box !important;

    position: fixed !important;

    top: 24px !important;
    right: 24px !important;
    left: auto !important;

    width: 225px !important;
    min-width: 185px !important;
    max-width: 185px !important;

    padding: 12px 16px !important;

    background: #1E302B !important;

    border: 1px solid #AFA99E !important;
    border-radius: 8px !important;

    box-shadow:
        0 10px 30px rgba(0,0,0,.45) !important;

    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;

    text-align: left !important;

    opacity: 0 !important;
    transform: translateY(-8px) !important;

    transition:
        opacity .35s ease,
        transform .35s ease !important;
}


#roomInfoCard.visible {
    opacity: 1 !important;
    transform: translateY(0) !important;
}


/* ROOM NAME */

#roomInfoCard .hud-name {
    display: block !important;

    margin: 0 0 4px !important;
    padding: 0 !important;

    color: #FFFFFF !important;

    font-size: 24px !important;
    line-height: 1.1 !important;
    font-weight: 600 !important;

    letter-spacing: 0 !important;
}


/* DIMENSIONS */

#roomInfoCard .hud-dims {
    display: flex !important;
    align-items: center !important;

    gap: 5px !important;

    margin: 0 !important;
    padding: 0 !important;

    color: #F5F2EA !important;

    font-size: 14px !important;
    line-height: 1.2 !important;
    font-weight: 500 !important;

    letter-spacing: 0 !important;
    white-space: nowrap !important;
}

#roomInfoCard .hud-dims > span {
    display: inline-block !important;
    margin: 0 !important;
    padding: 0 !important;
}

#roomInfoCard .hud-multiply {
    opacity: .72;
    margin: 0 !important;
}


/* SQ FT */

#roomInfoCard .hud-sqft {
    display: block !important;

    margin: 0 !important;
    padding: 0 !important;

    color: #D8D3C9 !important;

    font-size: 19px !important;
    line-height: 1.2 !important;
    font-weight: 500 !important;

    letter-spacing: .12em !important;

    text-transform: uppercase !important;
}


/* FT */

#roomInfoCard .hud-accent {
    color: #E8E3D9 !important;
}
/* =========================================
   MOBILE
========================================= */

@media (max-width: 768px) {

    #roomInfoCard {
        top: 14px !important;
        right: 14px !important;

        width: 195px !important;
        min-width: 195px !important;
        max-width: 195px !important;

        padding: 14px 16px !important;

        border-radius: 7px !important;
    }

    #roomInfoCard .hud-name {
        font-size: 19px !important;
        margin-bottom: 10px !important;
    }

    #roomInfoCard .hud-dims {
        font-size: 11px !important;
        margin-bottom: 5px !important;
    }

    #roomInfoCard .hud-sqft {
        font-size: 8px !important;
    }
}

/* =========================================
   SCROLL ARROW
========================================= */

.scroll-arrow {
    display: none;

    align-items: center;
    justify-content: center;

    width: 36px;
    height: 40px;

    margin-left: 5px;

    flex-shrink: 0;

    border: 1px solid rgba(255,255,255,.16);
    border-radius: 12px;

    background: rgba(12,12,12,.55);
    color: #fff;

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    pointer-events: none;

    transition: opacity .3s ease;
}

.scroll-arrow svg {
    width: 15px;
    height: 15px;
}

.scroll-arrow.hidden {
    opacity: 0;
}


/* =========================================
   BALCONY / FLOOR CONTROL
========================================= */

#balconyControls {
    position: fixed;

    top: 50%;
    right: 24px;

    transform: translateY(-50%);

    z-index: 10001;

    display: none;

    flex-direction: column;
    align-items: center;

    padding: 5px;

background: rgba(18,35,30,.94);
    border: 1px solid rgba(255,255,255,.17);
    border-radius: 17px;

    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);

    box-shadow:
        0 12px 40px rgba(0,0,0,.3),
        inset 0 1px 0 rgba(255,255,255,.07);

    overflow: hidden;
}

#balconyControls .floor-btn {
    width: 42px;
    height: 42px;

    border: 0;
    border-radius: 12px;

    background: transparent;
    color: rgba(255,255,255,.72);

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    transition:
        background .2s ease,
        color .2s ease,
        transform .2s ease;
}

#balconyControls .floor-btn:hover {
    background: rgba(255,255,255,.10);
    color: #fff;

    transform: scale(1.04);
}

#balconyControls .floor-btn:active {
    transform: scale(.94);
}

#balconyControls .floor-btn svg {
    width: 17px;
    height: 17px;
}

#floorIndicator {
    width: 42px;

    padding: 9px 0;

    border-top: 1px solid rgba(255,255,255,.10);
    border-bottom: 1px solid rgba(255,255,255,.10);

    color: #fff;

    font-family: 'Jost', sans-serif;
    font-size: 9px;
    font-weight: 500;

    line-height: 1.45;
    letter-spacing: .12em;

    text-align: center;
    text-transform: uppercase;
}


/* =========================================
   DESKTOP
========================================= */

@media (min-width: 769px) {

    .tour-nav-wrap {
        left: 50% !important;
        right: auto !important;
        bottom: 22px !important;

        width: auto !important;

        transform: translateX(-50%) !important;
    }

    .tour-nav-wrap .tour-nav {
        position: static !important;

        transform: none !important;

        left: auto !important;
        right: auto !important;
        bottom: auto !important;
    }

    .scroll-arrow {
        display: none !important;
    }
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 768px) {

    #backBtn {
        top: 14px;
        left: 14px;

        width: 40px;
        height: 40px;

        border-radius: 13px;
    }

    #backBtn svg {
        width: 17px;
        height: 17px;
    }




    .tour-nav-wrap {
        left: 10px;
        right: 10px;
        bottom: 10px;

        width: auto;
        max-width: none;

        transform: none;

        display: flex;
    }

    .tour-nav {
        width: 100%;

        padding: 6px;

        gap: 4px;

        border-radius: 15px;
    }

    .tour-pill {
        height: 38px;

        padding: 0 13px;

        border-radius: 10px;

        font-size: 12px;
    }

    .tour-pill svg {
        width: 15px;
        height: 15px;
    }

    .scroll-arrow {
        display: flex;
    }


    #balconyControls {
        right: 12px;
    }

    #balconyControls .floor-btn {
        width: 39px;
        height: 39px;
    }

    #floorIndicator {
        width: 39px;
        font-size: 8px;
    }
}


/* =========================================
   SMALL PHONES
========================================= */

@media (max-width: 400px) {

    #backBtn {
        width: 37px;
        height: 37px;
    }

    #roomInfoCard {
        padding: 10px 12px;
    }

    #roomInfoCard .hud-name {
        font-size: 15px;
    }

    #roomInfoCard .hud-dims {
        font-size: 10px;
    }

    .tour-pill {
        height: 36px;
        padding: 0 11px;
        font-size: 11px;
    }
}
/* =========================================
   REQUEST TO HOLD BUTTON
========================================= */

#holdRequestBtn {
    position: fixed;
    right: 24px;
    bottom: 94px;

    z-index: 10002;

    height: 46px;
    padding: 0 22px;

    border: 1px solid rgba(255,255,255,.35);
    border-radius: 13px;

    background: #E8E3D9;
    color: #1E302B;

    font-family: 'Jost', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .04em;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.65);

    transition:
        background .25s ease,
        color .25s ease,
        transform .25s ease,
        box-shadow .25s ease;
}

#holdRequestBtn svg {
    width: 17px;
    height: 17px;
}

#holdRequestBtn:hover {
    background: #1E302B;
    color: #E8E3D9;
    border-color: rgba(232,227,217,.55);

    transform: translateY(-2px);

    box-shadow:
        0 14px 35px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.08);
}

#holdRequestBtn:active {
    transform: translateY(0) scale(.98);
}


/* =========================================
   HOLD REQUEST OVERLAY
========================================= */

#holdOverlay {
    position: fixed;
    inset: 0;

    z-index: 20000;

    display: none;
    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(0,0,0,.58);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}

#holdOverlay.show {
    display: flex;
}


/* =========================================
   HOLD FORM CARD
========================================= */

#holdCard {
    position: relative;

    width: 430px;
    max-width: 100%;

    padding: 30px;

    background: #1E302B;

    border: 1px solid #AFA99E;
    border-radius: 14px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.08);

    color: #F5F2EA;

    animation: holdCardIn .3s ease;
}

@keyframes holdCardIn {
    from {
        opacity: 0;
        transform: translateY(15px) scale(.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}


/* =========================================
   CLOSE BUTTON
========================================= */

#holdClose {
    position: absolute;

    top: 14px;
    right: 14px;

    width: 34px;
    height: 34px;

    border: 1px solid rgba(255,255,255,.18);
    border-radius: 10px;

    background: rgba(255,255,255,.06);
    color: #F5F2EA;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    transition: .25s ease;
}

#holdClose:hover {
    background: #E8E3D9;
    color: #1E302B;
}

#holdClose svg {
    width: 16px;
    height: 16px;
}


/* =========================================
   FORM TITLE
========================================= */

#holdCard h2 {
    margin: 0 45px 7px 0;

    font-size: 24px;
    font-weight: 600;

    color: #FFFFFF;
}

#holdCard .hold-subtitle {
    margin: 0 0 24px;

    font-size: 12px;
    line-height: 1.6;

    color: #D8D3C9;

    letter-spacing: .02em;
}


/* =========================================
   FORM GROUP
========================================= */

.hold-field {
    margin-bottom: 16px;
}

.hold-field label {
    display: block;

    margin-bottom: 7px;

    font-size: 11px;
    font-weight: 500;

    color: #D8D3C9;

    letter-spacing: .08em;
    text-transform: uppercase;
}

.hold-field input,
.hold-field select,
.hold-field textarea {
    width: 100%;

    height: 44px;

    padding: 0 13px;

    border: 1px solid rgba(175,169,158,.55);
    border-radius: 9px;

    outline: none;

    background: rgba(255,255,255,.06);
    color: #F5F2EA;

    font-family: 'Jost', sans-serif;
    font-size: 13px;

    transition:
        border-color .2s ease,
        background .2s ease,
        box-shadow .2s ease;
}

.hold-field textarea {
    height: 80px;
    padding: 12px 13px;
    resize: none;
}

.hold-field input::placeholder,
.hold-field textarea::placeholder {
    color: rgba(245,242,234,.42);
}

.hold-field input:focus,
.hold-field select:focus,
.hold-field textarea:focus {
    border-color: #E8E3D9;

    background: rgba(255,255,255,.09);

    box-shadow:
        0 0 0 3px rgba(232,227,217,.08);
}

.hold-field select option {
    background: #1E302B;
    color: #F5F2EA;
}


/* =========================================
   SELECTED ROOM
========================================= */

#selectedRoom {
    width: 100%;

    padding: 12px 14px;

    margin-bottom: 18px;

    border: 1px solid rgba(175,169,158,.45);
    border-radius: 9px;

    background: rgba(232,227,217,.07);

    font-size: 12px;
    color: #E8E3D9;
}

#selectedRoom strong {
    color: #FFFFFF;
}


/* =========================================
   SUBMIT BUTTON
========================================= */

#submitHoldBtn {
    width: 100%;
    height: 46px;

    margin-top: 5px;

    border: 1px solid rgba(255,255,255,.35);
    border-radius: 10px;

    background: #E8E3D9;
    color: #1E302B;

    font-family: 'Jost', sans-serif;
    font-size: 13px;
    font-weight: 600;

    letter-spacing: .05em;

    cursor: pointer;

    transition: .25s ease;
}

#submitHoldBtn:hover {
    background: #F5F2EA;

    transform: translateY(-1px);

    box-shadow:
        0 8px 25px rgba(0,0,0,.25);
}

#submitHoldBtn:active {
    transform: translateY(0);
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 768px) {

    #holdRequestBtn {
        right: 14px;
        bottom: 68px;

        height: 42px;

        padding: 0 16px;

        font-size: 11px;

        border-radius: 11px;
    }

    #holdRequestBtn svg {
        width: 15px;
        height: 15px;
    }

    #holdCard {
        width: 100%;

        padding: 24px 20px;

        border-radius: 12px;
    }

    #holdCard h2 {
        font-size: 21px;
    }
}

 <defs>

<g filter="url(#softShadow)">

// =========================================

        // Read initial room from URL
   
function createRoomPanorama(webpFile, jpgFile) {

    const webpPath = `images/${webpFile}`;
    const jpgPath  = `images/${jpgFile}`;

    // Load WebP first
    const panorama = new PANOLENS.ImagePanorama(webpPath);

    // Wait for WebP to load
    panorama.addEventListener("load", function () {

        const loader = new THREE.TextureLoader();

        loader.load(
            jpgPath,

            function (jpgTexture) {

                if (!panorama.material) return;

                // Current WebP texture
                const webpTexture = panorama.material.map;

                // =========================================
                // PRESERVE WEBP COLOR / BRIGHTNESS
                // =========================================

                if (webpTexture) {

                    // Preserve Three.js r124 color encoding
                    if ("encoding" in webpTexture) {
                        jpgTexture.encoding =
                            webpTexture.encoding ||
                            THREE.sRGBEncoding;
                    }

                    // Preserve orientation
                    jpgTexture.flipY = webpTexture.flipY;

                    // Preserve wrapping
                    jpgTexture.wrapS = webpTexture.wrapS;
                    jpgTexture.wrapT = webpTexture.wrapT;

                    // Preserve filtering
                    jpgTexture.minFilter = webpTexture.minFilter;
                    jpgTexture.magFilter = webpTexture.magFilter;

                    // Preserve anisotropy
                    if ("anisotropy" in webpTexture) {
                        jpgTexture.anisotropy =
                            webpTexture.anisotropy;
                    }
                }

                jpgTexture.needsUpdate = true;

                // =========================================
                // REPLACE WEBP WITH JPG
                // =========================================

                panorama.material.map = jpgTexture;
                panorama.material.needsUpdate = true;

                // Free WebP texture memory
                if (webpTexture) {
                    webpTexture.dispose();
                }

                console.log(
                    "WEBP → JPG COMPLETE:",
                    jpgPath
                );
            },

            undefined,

            function (error) {

                console.error(
                    "JPG FAILED TO LOAD:",
                    jpgPath,
                    error
                );

            }
        );

    });

    return panorama;
}

        const BALCONY_FLOORS = [1, 5, 10, 15, 20, 25, 32];

        function getInitialBalconyFloor() {
            const requested = parseInt(params.get("balconyFloor") || selectedFloor, 10);
            if (!Number.isFinite(requested)) return 1;
            // If the actual apartment floor is not one of the balcony renders,
            // start at the closest available balcony render.
            return BALCONY_FLOORS.reduce((best, f) =>
                Math.abs(f - requested) < Math.abs(best - requested) ? f : best, BALCONY_FLOORS[0]);
        }

        function getBalconyTowerFolder() {
            const tower = String(params.get("tower") || sessionStorage.getItem("selectedTower") || "9")
                .toUpperCase().replace(/[-_ ]/g, "");
            if (tower === "12A" || tower === "C12A") return "Floor_12A";
            if (["9", "10", "11", "12"].includes(tower)) return `Floor_${tower}`;
            // Keep Tower-B independent; its floor images can use the same floor set.
            return "Floor_9";
        }

        function createBalconyPanorama(floor) {
            const towerFolder = getBalconyTowerFolder();
            const baseName = `${balconyType} Floor ${floor}`;
            const webpPath = `../../balcony/360/${towerFolder}/${baseName}.webp`;
            const pngPath  = `../../balcony/360/${towerFolder}/${baseName}.png`;

            // WebP first; PNG replaces it in the background. No color/brightness changes.
            const panorama = new PANOLENS.ImagePanorama(webpPath);
            panorama.userData = { isBalconyPanorama: true, balconyFloor: floor, balconyType, webpPath, pngPath };

            panorama.addEventListener("load", function () {
                const loader = new THREE.TextureLoader();
                loader.load(pngPath, function (pngTexture) {
                    if (!panorama.material) { pngTexture.dispose(); return; }
                    const webpTexture = panorama.material.map;
                    if (webpTexture) {
                        if ("encoding" in webpTexture && "encoding" in pngTexture) pngTexture.encoding = webpTexture.encoding;
                        pngTexture.flipY = webpTexture.flipY;
                        pngTexture.wrapS = webpTexture.wrapS;
                        pngTexture.wrapT = webpTexture.wrapT;
                        pngTexture.minFilter = webpTexture.minFilter;
                        pngTexture.magFilter = webpTexture.magFilter;
                        pngTexture.anisotropy = webpTexture.anisotropy;
                        if ("premultiplyAlpha" in webpTexture) pngTexture.premultiplyAlpha = webpTexture.premultiplyAlpha;
                        if ("unpackAlignment" in webpTexture) pngTexture.unpackAlignment = webpTexture.unpackAlignment;
                    }
                    pngTexture.needsUpdate = true;
                    panorama.material.map = pngTexture;
                    panorama.material.needsUpdate = true;
                    if (webpTexture) webpTexture.dispose();
                    console.log("BALCONY WEBP → PNG COMPLETE:", pngPath);
                }, undefined, function (error) {
                    console.error("BALCONY PNG FAILED TO LOAD:", pngPath, error);
                });
            });
            return panorama;
        }

        rooms.balcony = createBalconyPanorama(currentBalconyFloor);

        // Add all panoramas
        Object.values(rooms).forEach(p => viewer.add(p));

        function updateActiveRoomPill(roomName) {

        function updateBalconyControls(roomName) {
            window.HeroHomesAnalytics?.trackRoom(roomName, { balconyType, balconyFloor: currentBalconyFloor });

            if (!controls) return;

        function addBalconyHotspots(panorama) {
            const spot = new PANOLENS.Infospot(500, ARROW_ICON);
            const r = 5000;
            const yaw = -130;
            const pitch = -6;
            const phi = THREE.MathUtils.degToRad(90 - pitch);
            const theta = THREE.MathUtils.degToRad(yaw);
            spot.position.set(
                r * Math.sin(phi) * Math.cos(theta),
                r * Math.cos(phi),
                r * Math.sin(phi) * Math.sin(theta)
            );
            spot.addHoverText("Master Bedroom");

        function changeBalconyFloor(floor) {
            floor = parseInt(floor, 10);
            if (!BALCONY_FLOORS.includes(floor)) return;
            currentBalconyFloor = floor;
            sessionStorage.setItem("balconyType", balconyType);
            const oldBalcony = rooms.balcony;
            const panorama = createBalconyPanorama(currentBalconyFloor);
            panorama.fadeDuration = 1200;
            addBalconyHotspots(panorama);
            viewer.add(panorama);
            rooms.balcony = panorama;

            // Keep the balcony panorama at its configured starting angle.
            setTimeout(() => {

            updateBalconyControls("balcony");

            // Remove the previous dynamically-created panorama when PANOLENS exposes remove().
            if (oldBalcony && oldBalcony !== rooms.balcony && typeof viewer.remove === "function") {
                try { viewer.remove(oldBalcony); } catch (e) {}
            }
        }

        if (balconyFloorSelect) {
            balconyFloorSelect.addEventListener("change", () => {

            spot.position.set(

// =========================================
// 360° CAMERA STARTING ANGLES
// =========================================
//
// yaw   = left / right rotation in degrees
// pitch = up / down rotation in degrees
// fov   = zoom level (smaller = more zoomed in)
//
// Change these values for each room to decide exactly
// which direction the 360° panorama opens toward.
// =========================================

const CAMERA_ANGLES = {
    lobby:       { yaw:   0, pitch:  0, fov: 100 },
    dinning:     { yaw: 0, pitch:  0, fov: 100 },
    kitchen:     { yaw:  0, pitch:  0, fov: 100 },
    room_1:      { yaw:  0, pitch:  0, fov: 100 },
    room_2:      { yaw: 0, pitch:  0, fov: 100 },
    room_3:      { yaw:  0, pitch:  0, fov: 100 },
    bathroom_1:  { yaw: 0, pitch:  0, fov: 100 },
    bathroom_2:  { yaw:   0, pitch:  0, fov: 100 },
    bathroom_3:  { yaw:  0, pitch:  0, fov: 100 },
    balcony:     { yaw: 0, pitch: -5, fov: 100 },
    pool:        { yaw:   0, pitch:  0, fov: 100 }
};

function applyCameraAngle(roomName) {
    const angle = CAMERA_ANGLES[roomName];
    if (!angle || !viewer || !viewer.camera) return;

    const distance = 5000;

    const phi = THREE.MathUtils.degToRad(90 - angle.pitch);
    const theta = THREE.MathUtils.degToRad(angle.yaw);

    const target = new THREE.Vector3(
        distance * Math.sin(phi) * Math.cos(theta),
        distance * Math.cos(phi),
        distance * Math.sin(phi) * Math.sin(theta)
    );

    // Smoothly rotate the 360° view to the requested direction.
    if (typeof viewer.tweenControlCenter === "function") {
        viewer.tweenControlCenter(target, 700);
    } else {
        viewer.camera.lookAt(target);
    }

    viewer.camera.fov = angle.fov;
    viewer.camera.updateProjectionMatrix();
}

// ── Nav pill navigation ──
function goToRoom(roomName, btn, requestedBalconyType = balconyType) {
    if (roomName === "balcony") {
        balconyType = requestedBalconyType === "B" ? "B" : "F";
        sessionStorage.setItem("balconyType", balconyType);
    }

    // Remember the balcony side so Back can return to the correct view.
    if (!isGoingBack) {
        const entry = {
            roomName,
            balconyType: roomName === "balcony" ? balconyType : null
        };
        const previous = roomHistory[roomHistory.length - 1];
        if (!previous || previous.roomName !== entry.roomName ||
            previous.balconyType !== entry.balconyType) {
            roomHistory.push(entry);
        }
    }

    updateActiveRoomPill(roomName);

    const overlay =
        document.getElementById("fadeOverlay");

    overlay.style.opacity = 0.25;

    setTimeout(() => {

        if (roomName === "balcony" && rooms.balcony.userData.balconyType !== balconyType) {
            changeBalconyFloor(currentBalconyFloor);
        } else {
            viewer.setPanorama(rooms[roomName]);
        }

        // Apply saved starting camera angle
        setTimeout(() => {
            applyCameraAngle(roomName);
        }, 50);

        overlay.style.opacity = 0;

        showInfoCard(roomName);

        updateBalconyControls(roomName);

    }, 300);
}

// ROOM HISTORY + PAGE HISTORY
// =========================================

let roomHistory = [{
    roomName: startRoom,
    balconyType: startRoom === "balcony" ? balconyType : null
}];
let isGoingBack = false;

document.getElementById("backBtn").addEventListener("click", function (e) {

    e.preventDefault();
    e.stopPropagation();

    // -----------------------------------------
    // STEP 1: Go back through room history
    // -----------------------------------------

    if (roomHistory.length > 1) {

        // Remove current room
        roomHistory.pop();

        // Get previous room
        const previousRoom =
            roomHistory[roomHistory.length - 1];

        if (!previousRoom || !rooms[previousRoom.roomName]) {
            return;
        }

        // Tell goToRoom() this is a BACK navigation
        isGoingBack = true;

        goToRoom(previousRoom.roomName, null, previousRoom.balconyType);

        // Reset after navigation has been triggered
        setTimeout(() => {
            isGoingBack = false;
        }, 350);

        return;
    }

    // -----------------------------------------
    // STEP 2: No room history left
    // Go back to the actual previous page
    // -----------------------------------------

    window.history.back();
});
        // Bottom room navigation arrows
        const tourNav = document.getElementById('tourNav');
        const scrollArrow = document.getElementById('scrollArrow');
        const scrollArrowLeft = document.getElementById('scrollArrowLeft');

        if (tourNav && scrollArrow && scrollArrowLeft) {

            function updateScrollArrows() {
                const atStart = tourNav.scrollLeft <= 6;
                const atEnd =
                    tourNav.scrollLeft + tourNav.clientWidth >=
                    tourNav.scrollWidth - 6;

                // Back arrow appears only after the user has moved forward.
                scrollArrowLeft.classList.toggle('hidden', atStart);

                // Forward arrow disappears when all rooms are visible.
                scrollArrow.classList.toggle('hidden', atEnd);
            }

            function scrollRooms(direction) {
                const amount = Math.max(
                    220,
                    Math.round(tourNav.clientWidth * 0.55)
                );

                tourNav.scrollBy({
                    left: direction * amount,
                    behavior: 'smooth'
                });
            }

            scrollArrow.addEventListener('click', function (e) {
                e.preventDefault();
                e.stopPropagation();
                scrollRooms(1);
            });

            scrollArrowLeft.addEventListener('click', function (e) {
                e.preventDefault();
                e.stopPropagation();
                scrollRooms(-1);
            });

            tourNav.addEventListener('scroll', updateScrollArrows, { passive: true });
            window.addEventListener('resize', updateScrollArrows);

            requestAnimationFrame(updateScrollArrows);
            window.addEventListener('load', updateScrollArrows);
        }
