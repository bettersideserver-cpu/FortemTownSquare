    <style>
        body {
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        .content-wrapper {
            position: relative;
            display: inline-block;
        }

        .content-wrapper img {
            display: block;
            height: auto;
            width: 100%;
        }

        .Cutout {

            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(var(--scene-scale, 1));
            width: 90vmin;
            /* aspect-ratio: 4096 / 4096; */
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;

            z-index: 1;
        }

        .Cutout svg {
            position: absolute;
            top: 50%;
            left: 50%;
            width: auto;
            height: auto;
            min-width: 100%;
            min-height: 100%;
            transform: translate(-50%, -50%);
        }

        .Cutout path {
            pointer-events: auto;
            fill: transparent;
            pointer-events: auto;
            cursor: pointer;
            stroke: transparent;
            stroke-width: 4px;
            stroke-linejoin: round;
            stroke-linecap: round;
            transition: stroke 0.3s ease, fill 0.3s ease;
        }


        .Cutout path:hover {
            fill: transparent !important;
            stroke: transparent !important;
        }


        .Cutout path.selected {
            fill: transparent !important;
            stroke: transparent !important;
        }

        .lobby-top {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgb(7, 7, 7);
        }

        .content-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .content-wrapper img {
            display: block;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            object-position: center;
            user-select: none;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            .lobby-top {
                overflow: hidden;
                cursor: grab;
                align-items: flex-start;
                justify-content: flex-start;
            }

            .lobby-top.dragging {
                cursor: grabbing;
            }

            .content-wrapper {
                position: absolute;
                top: 0;
                left: 0;
                width: auto;
                height: 100vh;
                will-change: transform;
            }

            .content-wrapper img {
                display: block;
                width: auto;
                height: 100vh;
                max-width: none;
                object-fit: fill;
            }

            .Cutout {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                transform: none;
            }

            .Cutout svg {
                top: 0;
                left: 0;
                transform: none;
                /* 🔥 IMPORTANT */
                width: 100%;
                height: 100%;
                min-width: unset;
                min-height: unset;
            }
        }


        .touch-button {
            position: absolute;
            top: 0;
            left: 0;
            transform: translate(-50%, -50%) scale(var(--btn-scale, 1));
            transform-origin: center center;

            padding: 12px 12px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            color: #000;
            cursor: pointer;
            z-index: 10;
        }

        /* FLOOR PILL BASE */
        /* FLOOR PILL BASE */
        .floor-pill {
            position: fixed;
            top: 20px;
            right: 20px;
            /* FIXED */
            z-index: 9999;

            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 999px;
            padding: 8px 12px;

            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            font-family: sans-serif;
        }

        /* BUTTON */
        .floor-pill__trigger {
            color: #000000;
            font-size: 14px;
            cursor: pointer;
            padding: 8px 14px;
            border-radius: 999px;
            transition: background 0.3s;
        }

        .floor-pill__trigger:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* DROPDOWN */
        .floor-pill__list {
            position: absolute;
            top: 110%;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            transform-origin: top;

            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 12px;

            display: flex;
            flex-direction: column;
            gap: 8px;

            /* ✅ CONTROL SIZE HERE */
            width: 100px;
            /* fixed width */
            max-height: 220px;
            /* limit height */
            overflow-y: auto;
            /* scroll if too many items */

            opacity: 0;
            pointer-events: none;
            transition: all 0.25s ease;
        }

        /* OPEN STATE */
        .floor-pill.open .floor-pill__list {
            opacity: 1;
            transform: translateX(-50%) scale(1);
            pointer-events: auto;
        }

        /* ITEMS */
        .floor-pill__item {
            color: #000000;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 14px;
            transition: background 0.25s;

            text-align: center;
            /* 👈 centers text */
            display: block;
            /* ensures full width clickable */
        }

        .floor-pill__item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* ACTIVE */
        .floor-pill__item.active {
            background: rgba(201, 168, 124, 0.25);
            color: #c9a87c;
        }

        .touch-button:hover {
            background-color: #00649e;
            color: rgb(255, 255, 255);
        }

        .close-btn2 {
            position: fixed;

            /* TOP-LEFT CORNER */
            top: 16px;
            left: 16px;

            width: 50px;
            height: 50px;

            padding: 0;

            background: #ffffff;
            color: #000000;

            border: 1.5px solid #2F4539;
            border-radius: 50%;

            font-size: 0;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);

            z-index: 99999;
        }

        .close-btn2 svg {
            width: 18px;
            height: 18px;
            display: block;
        }

        @media (max-width: 600px) {
            .close-btn2 {
                top: 50px;
                left: 30px;
            }

            .touch-button {
                --btn-scale: 0.75;
                font-size: 14px;
                padding: 10px 10px;
            }

        }


        /* quick, soft placeholder look */
        .blur-up {
            filter: blur(10px);
            transform: scale(1.02);
            transition: filter .45s ease, transform .45s ease, opacity .35s ease;
        }

        /* once the full image is in */
        .blur-up.is-loaded {
            filter: blur(0);
            transform: scale(1);
            opacity: 1;
        }

        .floor-badge {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 999px;
            padding: 10px 28px;
            font-family: sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.08em;
            color: #000000;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(201, 168, 124, 0.3);
            white-space: nowrap;
            pointer-events: none;
        }


        /* ── APT TOOLTIP ── */
        #aptTooltip {
            position: fixed;
            z-index: 99999;
            pointer-events: none;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.18s ease, transform 0.18s ease;
            background: #1a1a1a;
            border: 1px solid rgba(201, 168, 124, 0.35);
            border-radius: 10px;
            padding: 10px 16px;
            font-family: sans-serif;
            color: #f0f0f0;
            white-space: nowrap;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55);
        }

        #aptTooltip.visible {
            opacity: 1;
            transform: translateY(0);
        }

        #aptTooltip .tt-bhk {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 3px;
        }

        #aptTooltip .tt-area {
            font-size: 13px;
            color: #aaaaaa;
        }

        /* ===== MOBILE RESPONSIVE ===== */
        @media (max-width: 600px) {

            #dock,
            .dock {
                width: 100vw !important;
                left: 0 !important;
                right: 0 !important;
                bottom: 0 !important;
                transform: none !important;
                border-radius: 0 !important;
                padding: 4px 0 !important;
                display: flex !important;
                justify-content: space-around !important;
                align-items: center !important;
            }

            .dock-item {
                display: flex !important;
                flex-direction: column !important;
                align-items: center !important;
                justify-content: center !important;
                flex: 1 !important;
                gap: 2px !important;
                padding: 4px 2px !important;
                transform: none !important;
                width: auto !important;
                height: auto !important;
            }

            .dock-icon,
            .dock-item img,
            .dock-item svg {
                width: 44px !important;
                height: 44px !important;
                min-width: 44px !important;
                min-height: 44px !important;
                max-width: 44px !important;
                max-height: 44px !important;
                transform: none !important;
            }

            .dock-item-label {
                display: block !important;
                font-size: 10px !important;
                color: #fff !important;
                text-align: center !important;
                margin-top: 2px !important;
            }

            .dock-item::after,
            .dock-item::before {
                display: none !important;
            }

            #lobby,
            .lobby {
                padding-bottom: 70px !important;
            }

            .close-btn,
            .close-btn2,
            #closeBtn,
            #closeBtn2 {
                width: 60px !important;
                height: 60px !important;
                font-size: 28px !important;
                top: 16px !important;
                left: 16px !important;
                position: fixed !important;
                z-index: 99999 !important;
            }

            #mobileAptPanel {
                display: none;
                position: fixed;
                bottom: 70px;
                left: 0;
                right: 0;
                background: rgba(0, 0, 0, 0.85);
                color: #fff;
                padding: 16px;
                z-index: 99998;
                border-radius: 12px 12px 0 0;
                font-size: 15px;
            }

            .apt-tooltip,
            .tooltip,
            [class*="tooltip"] {
                display: none !important;
            }
        }

        /* ── INFO BOX ── (styled entirely via JS; mobile-only) */
        /* ── INFO BOX ── */
        /* ── INFO BOX ── */
        #infoBox strong {
            font-weight: 600 !important;
            color: #111 !important;
            font-size: 14px !important;
            line-height: 1.2 !important;
        }

        .balcony-svg-link {
            cursor: pointer;
        }

    <style>
        /* Compact 360 medallions, locked to their shop positions in the SVG. */
        .shop-tour-slot { overflow: visible; pointer-events: none; }
        .shop-tour-button {
            position: relative; box-sizing: border-box;
            display: flex; align-items: center; justify-content: center;
            width: 100%; height: 100%; padding: 0;
            scale: .85; transform-origin: center;
            border: 2px solid #d7c49a; border-radius: 50%;
            background: linear-gradient(145deg, #587765 0%, #2f4539 60%, #21382c 100%);
            color: #fffdf6; font: 600 27px/1 Arial, sans-serif; letter-spacing: -.6px;
            text-decoration: none; white-space: nowrap; pointer-events: auto;
            box-shadow: inset 0 2px 2px #ffffff40, 0 6px 16px #17291f40;
            isolation: isolate;
            transition: transform .2s ease, box-shadow .2s ease;
        }
        .shop-tour-button::before {
            content: ''; position: absolute; inset: -8px;
            border: 2px solid #ffffffb3; border-radius: inherit;
            background: #ffffff14; z-index: -1;
            transition: border-color .2s ease;
        }
        .shop-tour-button > span:last-child { transform: translateY(-7px); }
        .shop-tour-icon {
            position: absolute; left: 17px; bottom: 14px; width: 46px; height: 14px;
            box-sizing: border-box; border: 3px solid #decea9;
            border-top-color: transparent; border-radius: 50%;
            font-size: 0; color: transparent;
        }
        .shop-tour-icon::after {
            content: ''; position: absolute; right: -5px; top: -2px;
            width: 0; height: 0; border-left: 7px solid #decea9;
            border-top: 5px solid transparent; border-bottom: 5px solid transparent;
            transform: rotate(-35deg);
        }
        .shop-tour-button:hover { transform: translateY(-3px); box-shadow: inset 0 2px 2px #ffffff40, 0 10px 22px #17291f55; }
        .shop-tour-button:hover::before { border-color: #eadab9; }
        .shop-tour-button:focus-visible { outline: 5px solid #fff; outline-offset: 10px; }
        .shop-tour-button:active { transform: translateY(0); }
        @media (prefers-reduced-motion: reduce) {
            .shop-tour-button, .shop-tour-button::before { transition: none; }
        }
    </style>

    <script>
        // Mobile drag-to-pan (horizontal only)
        (function () {
            if (window.innerWidth > 600) return;
            const lobby = document.querySelector('.lobby-top');
            const wrapper = document.querySelector('.content-wrapper');
            if (!lobby || !wrapper) return;

            let isDragging = false;
            let startX = 0;
            let translateX = 0;

            function getImgWidth() {
                const img = wrapper.querySelector('img');
                return img ? img.offsetWidth : window.innerWidth;
            }

            function clamp(val, min, max) { return Math.min(Math.max(val, min), max); }

            function applyTransform() {
                const minX = -(getImgWidth() - window.innerWidth);
                translateX = clamp(translateX, minX, 0);
                wrapper.style.transform = `translateX(${translateX}px)`;
            }

            // Touch
            lobby.addEventListener('touchstart', e => {
                if (e.touches.length !== 1) return;
                isDragging = true;
                startX = e.touches[0].clientX - translateX;
                lobby.classList.add('dragging');
            }, { passive: true });

            lobby.addEventListener('touchmove', e => {
                if (!isDragging || e.touches.length !== 1) return;
                translateX = e.touches[0].clientX - startX;
                applyTransform();
            }, { passive: true });

            lobby.addEventListener('touchend', () => {
                isDragging = false;
                lobby.classList.remove('dragging');
            });

            // Mouse (desktop fallback)
            lobby.addEventListener('mousedown', e => {
                isDragging = true;
                startX = e.clientX - translateX;
                lobby.classList.add('dragging');
            });
            window.addEventListener('mousemove', e => {
                if (!isDragging) return;
                translateX = e.clientX - startX;
                applyTransform();
            });
            window.addEventListener('mouseup', () => {
                isDragging = false;
                lobby.classList.remove('dragging');
            });

            // Init: start centered
            window.addEventListener('load', () => {
                translateX = -((getImgWidth() - window.innerWidth) / 2);
                applyTransform();
            });
        })();
    </script>

    <script>
        (function () {
            const tooltip = document.getElementById('aptTooltip');
            const ttBhk = document.getElementById('ttBhk');
            const ttArea = document.getElementById('ttArea');
            let mouseX = 0, mouseY = 0;

            document.addEventListener('mousemove', function (e) {
                mouseX = e.clientX;
                mouseY = e.clientY;
                if (tooltip.classList.contains('visible')) positionTooltip();
            });

            function positionTooltip() {
                const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
                let x = mouseX + 18, y = mouseY + 18;
                if (x + tw > window.innerWidth - 10) x = mouseX - tw - 14;
                if (y + th > window.innerHeight - 10) y = mouseY - th - 14;
                tooltip.style.left = x + 'px';
                tooltip.style.top = y + 'px';
            }

            document.querySelectorAll('.Cutout path').forEach(function (path) {
                if (path.hasAttribute('data-dimensions')) return;
                const bhk = path.getAttribute('data-bhk');
                const area = path.getAttribute('data-area');
                if (!bhk && !area) return;

                path.addEventListener('mouseenter', function () {
                    ttBhk.textContent = bhk || '—';
                    ttArea.textContent = area || '—';
                    positionTooltip();
                    tooltip.classList.add('visible');
                });

                path.addEventListener('mouseleave', function () {
                    tooltip.classList.remove('visible');
                });
            });
        })();
    </script>

    <script>
        /* BALCONY SVG -> BALCONY PANORAMA LINKING
         *
         * Change the IDs in the B or F arrays below to control which OFF-state
         * balcony SVG path opens the B Floor or F Floor panorama.
         * IDs are the exact SVG path IDs from this file.
         * Any balcony path not listed defaults to F.
         */
        (function () {
            const BALCONY_SVG_ASSIGNMENTS = {
                B: [
                    // PUT ANY BALCONY SVG IDs HERE to open B Floor.
                    // Example: "1 Balcony 1", "2 Balcony 3"
                    "1 Balcony_4",
                    "1 Balcony_3",
                    "2 Balcony_4",
                    "2 Balcony_3",
                ],
                F: [
                    "1 Balcony_2",
                    "1 Balcony_1",
                    "2 Balcony_2",
                    "2 Balcony_1",

                ]
            };

            const BALCONY_DEFAULT_TYPE = "F";
            const balconyTypeById = {};

            Object.entries(BALCONY_SVG_ASSIGNMENTS).forEach(([type, ids]) => {
                ids.forEach(id => {
                    balconyTypeById[String(id).replace(/\s+/g, " ").trim().toLowerCase()] = type;
                });
            });

            const normalize = value => String(value || "").replace(/\s+/g, " ").trim().toLowerCase();
            const file = location.pathname.split('/').pop();
            const tower = ({
                'Tower-9.html': '9',
                'Tower-10.html': '10',
                'Tower-11.html': '11',
                'Tower-12.html': '12',
                'Tower-C-12-A.html': '12A'
            })[file] || '';
            const params = new URLSearchParams(location.search);
            const floor = Number(params.get('floor') || sessionStorage.getItem('selectedFloor') || 1);

            function targetPage() {
                const map = {
                    '9': '../Tower-B/360/Typical.html',
                    '10': '../Tower-B/360/Typical.html',
                    '11': '../Tower-B/360/Typical.html',
                    '12': '../Tower-B/360/Typical.html',
                    '12A': '../Tower-B/360/Typical.html'
                };
                return map[tower] || '../Tower-B/360/Typical.html';
            }

            document.querySelectorAll('.Cutout path[id*="Balcony"], .Cutout path[id*="balcony"]').forEach(path => {
                const key = normalize(path.id);
                const type = String(path.dataset.balconyType || balconyTypeById[key] || BALCONY_DEFAULT_TYPE).toUpperCase() === 'B' ? 'B' : 'F';
                path.dataset.balconyType = type;
                path.classList.add('balcony-svg-link');

                path.addEventListener('click', function (e) {
                    // This handler is intentionally for the OFF-state balcony SVGs.
                    e.preventDefault();
                    e.stopImmediatePropagation();

                    const match = normalize(path.id).match(/^(1|2)\s+balcony/);
                    const unit = match ? match[1] : '1';

                    sessionStorage.setItem('selectedTower', tower);
                    sessionStorage.setItem('fortmenTownsquareTower', tower);
                    sessionStorage.setItem('selectedFloor', String(floor));
                    sessionStorage.setItem('fortmenTownsquareFloor', String(floor));
                    sessionStorage.setItem('selectedUnit', unit);
                    sessionStorage.setItem('balconyType', type);

                    const u = new URL(targetPage(), location.href);
                    u.searchParams.set('tower', tower);
                    u.searchParams.set('floor', String(floor));
                    u.searchParams.set('unit', unit);
                    u.searchParams.set('room', 'balcony');
                    u.searchParams.set('balconyType', type);
                    u.searchParams.set('balconyFloor', String(floor));
                    location.href = u.href;
                }, true);
            });
        })();

        /* FortmenTownsquare UNIT CONTEXT PATCH */
        (function () {
            const file = location.pathname.split('/').pop();
            const tower = ({ 'Tower-9.html': '9', 'Tower-10.html': '10', 'Tower-11.html': '11', 'Tower-12.html': '12', 'Tower-C-12-A.html': '12A' })[file] || '';
            const p = new URLSearchParams(location.search);
            const floor = Number(p.get('floor') || sessionStorage.getItem('selectedFloor') || 1);
            document.querySelectorAll('.Cutout path[data-link]').forEach(path => {
                const normalized = String(path.id || '').replace(/[^a-z0-9]/gi, '').toLowerCase();
                let n = null;
                if (normalized === 'appartment1') n = 1;
                if (normalized === 'appartment2') n = 2;
                if (!n) return;
                path.addEventListener('click', function (e) {
                    e.preventDefault(); e.stopImmediatePropagation();
                    sessionStorage.setItem('selectedTower', tower);
                    sessionStorage.setItem('fortmenTownsquareTower', tower);
                    sessionStorage.setItem('selectedFloor', String(floor));
                    sessionStorage.setItem('fortmenTownsquareFloor', String(floor));
                    sessionStorage.setItem('selectedUnit', String(n));
                    const base = path.getAttribute('data-link');
                    if (base) {
                        const u = new URL(base, location.href);
                        u.searchParams.set('tower', tower);
                        u.searchParams.set('floor', String(floor));
                        u.searchParams.set('unit', String(n));
                        location.href = u.href;
                    }
                }, true);
            });
        })();

                const originalShapes = Array.from(
                    layer.querySelectorAll(
                        'path:not(.hh-stroke-glow), polygon:not(.hh-stroke-glow), rect:not(.hh-stroke-glow), circle:not(.hh-stroke-glow), ellipse:not(.hh-stroke-glow)'
                    )
                );

                const glowGroup = document.createElementNS(
                    'http://www.w3.org/2000/svg',
                    'g'
                );

                glowGroup.setAttribute('id', 'hhStrokeGlowLayer');

                layer.insertBefore(glowGroup, layer.firstChild);

                originalShapes.forEach(function (original) {

                    const glow = original.cloneNode(true);

                    glow.removeAttribute('id');

                    glow.setAttribute('fill', 'none');
                    glow.setAttribute('stroke', '#ffffff');
                    glow.setAttribute('stroke-width', '5.5');
                    glow.setAttribute('stroke-linejoin', 'round');
                    glow.setAttribute('stroke-linecap', 'round');

                    glow.classList.add('hh-stroke-glow');

                    glowGroup.appendChild(glow);

                });

            }

            if (document.readyState === 'loading') {

                document.addEventListener(
                    'DOMContentLoaded',
                    createStrokeGlow
                );

            } else {

                createStrokeGlow();

            }

        })();
    </script>
