        body {
            margin: 0;
            overflow: hidden;

        .content-wrapper {
            position: relative;
            display: inline-block;
        }

        .content-wrapper img {
            display: block;
            height: auto;
            width: 100%;
        }

        .Cutout {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(var(--scene-scale, 1));
            width: 90vmin;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        .Cutout svg {
            position: absolute;
            top: 50%;
            left: 50%;
            width: auto;
            height: auto;
            min-width: 100%;
            min-height: 100%;
            transform: translate(-50%, -50%);
        }

        .Cutout path {
            pointer-events: auto;
            fill: transparent;
            cursor: pointer;
            stroke: transparent;
            stroke-width: 4px;
            stroke-linejoin: round;
            stroke-linecap: round;
            transition: stroke 0.3s ease, fill 0.3s ease;
        }

        .Cutout path:hover {
            fill: transparent !important;
            stroke: transparent !important;

        }

        .Cutout path.selected {
            fill: transparent !important;
            stroke: transparent !important;
        }

        .lobby-top {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgb(7, 7, 7);
        }

        .content-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .content-wrapper img {
            display: block;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            object-position: center;
            user-select: none;
            pointer-events: none;
        }

        /* ── MOBILE ── */
        @media (max-width: 600px) {

            html,
            body {
                overflow: hidden !important;
                width: 100vw !important;

                touch-action: none !important;
                overscroll-behavior: none !important;
            }

            .lobby-top {
                overflow: hidden !important;
                position: fixed !important;
                top: 0 !important;

                overscroll-behavior: none !important;
            }

            .lobby-top.dragging {
                cursor: grabbing;
            }

            .content-wrapper {
                position: absolute !important;

                left: 0 !important;
                width: 100% !important;
                height: 100% !important;
                overflow: hidden !important;
            }


            .content-wrapper img {
                display: block !important;
                width: 100% !important;
                height: 100% !important;
                object-fit: cover !important;
                object-position: center center !important;

            /* SVG locked inside content-wrapper, moved up via translateY */

            .Cutout {

        #aptTooltip {

        .floor-pill,

        .close-btn,

        .touch-button {
            position: absolute;
            top: 0;
            left: 0;
            transform: translate(-50%, -50%) scale(var(--btn-scale, 1));
            transform-origin: center center;
            padding: 12px 12px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            color: #000;
            cursor: pointer;
            z-index: 10;
        }

        /* FLOOR PILL */
        .floor-pill {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 999px;
            padding: 8px 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            font-family: sans-serif;
        }

        .floor-pill__trigger {
            color: #000000;
            font-size: 14px;
            cursor: pointer;
            padding: 8px 14px;
            border-radius: 999px;
            transition: background 0.3s;
        }

        .floor-pill__trigger:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .floor-pill__list {
            position: absolute;
            top: 110%;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            transform-origin: top;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100px;
            max-height: 220px;
            overflow-y: auto;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s ease;
        }

        .floor-pill.open .floor-pill__list {
            opacity: 1;
            transform: translateX(-50%) scale(1);
            pointer-events: auto;
        }

        .floor-pill__item {
            color: #000000;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 14px;
            transition: background 0.25s;
            text-align: center;
            display: block;
        }

        .floor-pill__item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .floor-pill__item.active {
            background: rgba(201, 168, 124, 0.25);
            color: #c9a87c;
        }

        .touch-button:hover {
            background-color: #00649e;
            color: rgb(255, 255, 255);
        }

        /* Room-name tooltip built by available-toggle.js (readable on mobile too) */
        #hhRoomTooltip {

            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            pointer-events: none;

        .close-btn2 {

            top: 50px;
            left: 90px;
            width: 40px;
            height: 40px;
            background-color: #2c2c2c;
            border-radius: 12px;
            border: none;

            color: white;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            transition: background-color 0.3s ease;
            z-index: 9999;
        }

        .close-btn2:hover {
            background-color: #444;
        }

        @media (max-width: 600px) {
            .close-btn2 {
                top: 50px;
                left: 30px;
            }

            .touch-button {
                --btn-scale: 0.9;
                font-size: 16px;
                padding: 12px 14px;
                min-width: 44px;
                min-height: 44px;
            }
        }

        .blur-up {
            filter: blur(10px);
            transform: scale(1.02);
            transition: filter .45s ease, transform .45s ease, opacity .35s ease;
        }

        .blur-up.is-loaded {
            filter: blur(0);
            transform: scale(1);
            opacity: 1;
        }

        .floor-badge {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 999px;
            padding: 10px 28px;
            font-family: sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.08em;
            color: #000000;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(201, 168, 124, 0.3);
            white-space: nowrap;
            pointer-events: none;
        }

        /* APT TOOLTIP */
        #aptTooltip {
            position: fixed;
            z-index: 99999;
            pointer-events: none;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.18s ease, transform 0.18s ease;
            background: #1a1a1a;
            border: 1px solid rgba(201, 168, 124, 0.35);
            border-radius: 10px;
            padding: 10px 16px;
            font-family: sans-serif;
            color: #f0f0f0;
            white-space: nowrap;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55);
        }

        #aptTooltip.visible {
            opacity: 1;
            transform: translateY(0);
        }

        #aptTooltip .tt-bhk {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 3px;
        }

        #aptTooltip .tt-area {
            font-size: 13px;
            color: #aaaaaa;

        /* MOBILE DOCK */
        @media (max-width: 600px) {

            #dock,
            .dock {

                right: 0 !important;

                display: flex !important;

                align-items: center !important;

            .dock-item-label {

                color: #fff !important;

                margin-top: 2px !important;

            .dock-item::after,

                display: none !important;

            .apt-tooltip,

    <style>
        /* Fortem Townsquare reference UI: red, white, charcoal. Visual styling only. */
        :root {
            --hh-red: #B5121B;
            --hh-red-dark: #850D14;
            --hh-white: #FFFFFF;
            --hh-ink: #292929;
            --hh-line: rgba(41, 41, 41, .16);
        }

        button,
        input[type="button"],
        input[type="submit"],
        .touch-button,
        .floor-pill__trigger,
        .floor-pill__item,
        .close-btn,
        .close-btn2,
        #closeCard,
        #closeBtn,
        #closeBtn2,
        .callback-close,
        .submit {
            font-family: inherit;
            border: 1px solid var(--hh-red) !important;
            border-radius: 10px !important;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .10);
            transition: background-color .2s ease, color .2s ease, border-color .2s ease;
        }

        .touch-button,
        .floor-pill,
        .floor-pill__list,
        .floor-pill__trigger,
        .floor-pill__item {
            background: var(--hh-white) !important;
            color: var(--hh-ink) !important;
            border-color: var(--hh-line) !important;
        }

        .touch-button:hover,
        .floor-pill__trigger:hover,
        .floor-pill__item:hover {
            background: #F8F8F8 !important;
            color: var(--hh-red) !important;
            border-color: var(--hh-red) !important;
        }

        .floor-pill__item.active,
        .floor-pill__item[aria-current="true"] {
            background: var(--hh-red) !important;
            color: var(--hh-white) !important;
            border-color: var(--hh-red) !important;
        }

        .close-btn2,
        #closeCard,
        .close-btn,
        #closeBtn,
        #closeBtn2,
        .callback-close {
            background: var(--hh-white) !important;
            color: var(--hh-red) !important;
            border: 1px solid var(--hh-red) !important;
        }

        .close-btn2:hover,
        #closeCard:hover,
        .close-btn:hover,
        #closeBtn:hover,
        #closeBtn2:hover,
        .callback-close:hover {
            background: var(--hh-red) !important;
            color: var(--hh-white) !important;
        }

        .submit,
        button[type="submit"],
        input[type="submit"] {
            background: var(--hh-red) !important;
            color: var(--hh-white) !important;
            border-color: var(--hh-red) !important;
        }

        .submit:hover,
        button[type="submit"]:hover,
        input[type="submit"]:hover {
            background: var(--hh-red-dark) !important;
            color: var(--hh-white) !important;
        }

        button:focus-visible,
        a:focus-visible,
        select:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--hh-red) !important;
            outline-offset: 2px;
        }

        @media (max-width: 600px) {
            #hhFloorControls {
                top: 12px;
                right: 12px;
                width: 160px;
            }

            #hhFloorDropdown,
            #hhFloorSelect {
                width: 160px;
            }

            #hhFloorSelect {
                height: 48px;
                padding: 0 14px;
                font-size: 15px;
            }

            #hhAvailableRow {
                width: 160px;
                height: 44px;
                padding: 0 12px;
            }

            #hhAvailableLabel {
                font-size: 13px;
            }

            #hhAvailableSwitch {
                width: 44px;
                height: 26px;
                flex: 0 0 44px;
            }

            #hhAvailableSlider:before {
                width: 22px;
                height: 22px;
            }

            #hhAvailableSwitch input:checked+#hhAvailableSlider:before {
                transform: translateX(18px);
            }

            #hhFloorMenu {
                top: 52px;
                max-height: 300px;
            }

            .hhFloorOption {
                min-height: 44px;
                padding: 10px 12px;
                font-size: 14px;
            }
        }

        @media (max-width: 600px) {

            html,
            body {
                overscroll-behavior: none;
            }

            /* Prevent unwanted page scrolling */
            body {
                overflow-x: hidden;
            }

            /* Keep the background from responding to touch gestures */
            .lobby-top {
                touch-action: none !important;
            }
        }

        #closeCard {
            width: 50px !important;
            height: 50px !important;

            padding: 0 !important;

            display: flex !important;
            align-items: center !important;
            justify-content: center !important;

            background: #fff !important;
            color: #000 !important;

            border: 1.5px solid #B5121B !important;
            border-radius: 50% !important;

            box-shadow: 0 4px 14px rgba(0, 0, 0, .15) !important;

            font-size: 0 !important;
        }

        #closeCard svg {
            width: 18px !important;
            height: 18px !important;

            display: block !important;
            margin: 0 !important;
        }
    </style>

    <script>
        (function () {
            if (window.innerWidth <= 600) return; // skip on mobile
            const tooltip = document.getElementById('aptTooltip');
            const ttBhk = document.getElementById('ttBhk');
            const ttArea = document.getElementById('ttArea');

            let mouseX = 0, mouseY = 0;

            document.addEventListener('mousemove', function (e) {
                mouseX = e.clientX;
                mouseY = e.clientY;
                if (tooltip.classList.contains('visible')) {
                    positionTooltip();
                }
            });

            function positionTooltip() {
                const tw = tooltip.offsetWidth;
                const th = tooltip.offsetHeight;
                let x = mouseX + 18;
                let y = mouseY + 18;
                if (x + tw > window.innerWidth - 10) x = mouseX - tw - 14;
                if (y + th > window.innerHeight - 10) y = mouseY - th - 14;
                tooltip.style.left = x + 'px';
                tooltip.style.top = y + 'px';
            }

            document.querySelectorAll('.Cutout path').forEach(function (path) {
                const bhk = path.getAttribute('data-bhk');
                const area = path.getAttribute('data-area');
                if (!bhk && !area) return;

                path.addEventListener('mouseenter', function () {
                    ttBhk.textContent = bhk || '—';
                    ttArea.textContent = area || '—';
                    positionTooltip();
                    tooltip.classList.add('visible');
                });

                path.addEventListener('mouseleave', function () {
                    tooltip.classList.remove('visible');
                });
            });
        })();
    </script>

}

                for (var k in css) box.style.setProperty(k, css[k], 'important');

    <script>
        /* BALCONY SVG -> BALCONY PANORAMA LINKING
         *
         * Change the IDs in the B or F arrays below to control which OFF-state
         * balcony SVG path opens the B Floor or F Floor panorama.
         * IDs are the exact SVG path IDs from this file.
         * Any balcony path not listed defaults to F.
         */
        (function () {
            const BALCONY_SVG_ASSIGNMENTS = {
                B: [
                    // PUT ANY BALCONY SVG IDs HERE to open B Floor.
                    // Example: "1 Balcony 1", "2 Balcony 3"

                    " 2 Balcony 3",
                    " 2 Balcony 2",
                    " 2 Balcony 1",
                    "1 Balcony 1",
                    "1 Balcony 2",
                    "1 Balcony 3",
                ],
                F: [
                    "1 Balcony 4",
                    " 2 Balcony 4",

                ]
            };

            const BALCONY_DEFAULT_TYPE = "F";
            const balconyTypeById = {};

            Object.entries(BALCONY_SVG_ASSIGNMENTS).forEach(([type, ids]) => {
                ids.forEach(id => {
                    balconyTypeById[String(id).replace(/\s+/g, " ").trim().toLowerCase()] = type;
                });
            });

            const normalize = value => String(value || "").replace(/\s+/g, " ").trim().toLowerCase();
            const file = location.pathname.split('/').pop();
            const tower = ({
                'Tower-9.html': '9',
                'Tower-10.html': '10',
                'Tower-11.html': '11',
                'Tower-12.html': '12',
                'Tower-C-12-A.html': '12A'
            })[file] || '';
            const params = new URLSearchParams(location.search);
            const floor = Number(params.get('floor') || sessionStorage.getItem('selectedFloor') || 1);

            function targetPage() {
                const map = {
                    '9': '../9-12-Typical/Typical.html',
                    '10': '../Tower-10-12/360/Typical.html',
                    '11': '../Tower-B/360/Typical.html',
                    '12': '../Tower-10-12/360/Typical.html',
                    '12A': '../9-12-Typical/Typical.html'
                };
                return map[tower] || '../9-12-Typical/Typical.html';
            }

            document.querySelectorAll('.Cutout path[id*="Balcony"], .Cutout path[id*="balcony"]').forEach(path => {
                const key = normalize(path.id);
                const type = String(path.dataset.balconyType || balconyTypeById[key] || BALCONY_DEFAULT_TYPE).toUpperCase() === 'B' ? 'B' : 'F';
                path.dataset.balconyType = type;
                path.classList.add('balcony-svg-link');

                path.addEventListener('click', function (e) {
                    // This handler is intentionally for the OFF-state balcony SVGs.
                    e.preventDefault();
                    e.stopImmediatePropagation();

                    const match = normalize(path.id).match(/^(1|2)\s+balcony/);
                    const unit = match ? match[1] : '1';

                    sessionStorage.setItem('selectedTower', tower);
                    sessionStorage.setItem('heroHomesTower', tower);
                    sessionStorage.setItem('selectedFloor', String(floor));
                    sessionStorage.setItem('heroHomesFloor', String(floor));
                    sessionStorage.setItem('selectedUnit', unit);
                    sessionStorage.setItem('balconyType', type);

                    const u = new URL(targetPage(), location.href);
                    u.searchParams.set('tower', tower);
                    u.searchParams.set('floor', String(floor));
                    u.searchParams.set('unit', unit);
                    u.searchParams.set('room', 'balcony');
                    u.searchParams.set('balconyType', type);
                    u.searchParams.set('balconyFloor', String(floor));
                    location.href = u.href;
                }, true);
            });
        })();

        /* Fortem Townsquare UNIT CONTEXT PATCH */
        (function () {
            const file = location.pathname.split('/').pop();
            const tower = ({ 'Tower-9.html': '9', 'Tower-10.html': '10', 'Tower-11.html': '11', 'Tower-12.html': '12', 'Tower-C-12-A.html': '12A' })[file] || '';
            const p = new URLSearchParams(location.search);
            const floor = Number(p.get('floor') || sessionStorage.getItem('selectedFloor') || 1);
            document.querySelectorAll('.Cutout path[data-link]').forEach(path => {
                const normalized = String(path.id || '').replace(/[^a-z0-9]/gi, '').toLowerCase();

                if (normalized === 'appartment2') n = 2;

    <script>
        (function () {

            function createStrokeGlow() {

                const layer = document.getElementById('availableOffLayer');

                if (!layer) return;

                if (layer.querySelector('#hhStrokeGlowLayer')) return;

                const originalShapes = Array.from(
                    layer.querySelectorAll(
                        'path:not(.hh-stroke-glow), polygon:not(.hh-stroke-glow), rect:not(.hh-stroke-glow), circle:not(.hh-stroke-glow), ellipse:not(.hh-stroke-glow)'
                    )
                );

                const glowGroup = document.createElementNS(
                    'http://www.w3.org/2000/svg',
                    'g'
                );

                glowGroup.setAttribute('id', 'hhStrokeGlowLayer');

                layer.insertBefore(glowGroup, layer.firstChild);

                originalShapes.forEach(function (original) {

                    const glow = original.cloneNode(true);

                    glow.removeAttribute('id');

                    glow.setAttribute('fill', 'none');
                    glow.setAttribute('stroke', '#ffffff');
                    glow.setAttribute('stroke-width', '5.5');
                    glow.setAttribute('stroke-linejoin', 'round');
                    glow.setAttribute('stroke-linecap', 'round');

                    glow.classList.add('hh-stroke-glow');

                    glowGroup.appendChild(glow);

                });

            }

            if (document.readyState === 'loading') {

                document.addEventListener(
                    'DOMContentLoaded',
                    createStrokeGlow
                );

            } else {

                createStrokeGlow();

            }

        })();
    </script>

    <!-- ================================================================
         MOBILE FIX: lock the background photo and the SVG hotspot layer
         to the exact same box, on every phone size / rotation.

         Root cause of "background stuck / SVG in wrong spot": the photo
         used object-fit:cover while the SVG used preserveAspectRatio
         "slice" with its own viewBox (3840 x 5830). Those are two
         different cropping algorithms — they only agree when the photo's
         real aspect ratio exactly equals the viewBox aspect ratio, which
         is why the mismatch only showed up on narrow mobile aspect ratios.

         Fix: stop letting the browser crop each element on its own.
         Instead we size ONE shared "stage" box (#contentWrapper) so its
         aspect ratio always equals the SVG's viewBox aspect ratio, scaled
         up with cover-math to fully cover the screen, then center it.
         The image and the SVG both fill that exact same box edge-to-edge
         with no internal cropping, so they can never drift apart.
    ==================================================================== -->
    <script src="hh-mobile-stage-fix.js"></script>
