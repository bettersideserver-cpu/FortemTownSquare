<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FortmenTownsquare</title>
    <link rel="stylesheet" href="./../wbn05d6fbh.css">
    <link rel="stylesheet" href="./../JS/CSS/Floor-Hint.css">
    <link rel="stylesheet" href="./../JS/Notification/UI_Hint-CSS.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        /* ═══════════════════════════════════════════════
           FortmenTownsquare — MINIMAL VIEWER UI
           Greige field · cream surfaces · #0F3D2E accent
           ═══════════════════════════════════════════════ */
        :root {
            --bg-0: #C9C3B7;
            --bg-tint: #B8B0A0;

            --surface-1: #F4EDDD;
            --surface-2: #FBF7EC;
            --surface-3: #FBF7EC;

            --ink: #0A2B21;
            --ink-soft: rgba(10, 43, 33, 0.72);
            --ink-mid: rgba(10, 43, 33, 0.58);
            --ink-dim: rgba(10, 43, 33, 0.40);
            --ink-faint: rgba(10, 43, 33, 0.24);

            --gold: #0F3D2E;
            --gold-light: #1C5A44;
            --gold-dark: #04120D;
            --gold-soft: rgba(15, 61, 46, 0.06);
            --gold-tint: rgba(15, 61, 46, 0.12);

            --on-accent: #FBF7EC;
            --brass: #C39E59;

            --hair: rgba(10, 43, 33, 0.14);
            --hair-soft: rgba(10, 43, 33, 0.08);

            --text: #0A2B21;
            --text-muted: rgba(10, 43, 33, 0.55);

            --shadow-sm: 0 1px 2px rgba(10, 43, 33, 0.06);
            --shadow-md: 0 4px 16px rgba(10, 43, 33, 0.10);
            --shadow-lg: 0 12px 40px rgba(10, 43, 33, 0.16);

            --font-display: 'Cormorant Garamond', serif;
            --font-ui: 'Outfit', sans-serif;
            --ease-out: cubic-bezier(0.22, 0.68, 0, 1.04);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);

            --r: 10px;
            --r-lg: 16px;
            --r-pill: 999px;
            --bar: 56px;
            --foot: 48px;
        }

        body {
            background: var(--bg-0);
            color: var(--ink);
            font-family: var(--font-ui);
        }

        @media (max-width: 600px) {
            .Front {
                position: fixed;
                top: 55%;
                left: 50%;
            }
        }

        /* ═══ TOP BAR ═══════════════════════════════════ */
        /* Not a connected bar: two corner tabs anchored into the top edge.
           Cream runs flush to the top and to its own side; only the inner
           corner curves away. Middle is cut out so the image shows through.
           The rail itself is transparent and click-through. */
        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--bar);
            z-index: 10000;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            padding: 0;
            background: none;
            border: none;
            pointer-events: none;
            opacity: 0;
            animation: fade-down 0.7s var(--ease-out) 0.15s forwards;
        }

        @keyframes fade-down {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .tb-brand,
        .tb-actions {
            pointer-events: auto;
        }

        .tb-brand {
            display: flex;
            align-items: center;
            gap: 11px;
            user-select: none;
            height: 46px;
            padding: 0 26px 0 22px;
            background: var(--surface-2);
            border: 1px solid var(--hair);
            border-top: none;
            border-left: none;
            border-radius: 0 0 var(--r-lg) 0;
            box-shadow: var(--shadow-sm);
        }

        .tb-mark {
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--gold);
        }

        .tb-rule {
            width: 1px;
            height: 16px;
            background: var(--hair);
            align-self: center;
        }

        .tb-name {
            font-family: var(--font-display);
            font-size: 19px;
            font-weight: 600;
            letter-spacing: 0.01em;
            color: var(--ink);
            line-height: 1;
        }

        .tb-actions {
            display: flex;
            align-items: center;
            gap: 2px;
            height: 46px;
            padding: 0 10px 0 12px;
            background: var(--surface-2);
            border: 1px solid var(--hair);
            border-top: none;
            border-right: none;
            border-radius: 0 0 0 var(--r-lg);
            box-shadow: var(--shadow-sm);
        }

        .control-btn {
            display: flex;
            align-items: center;
            gap: 9px;
            height: 32px;
            padding: 0 15px;
            background: none;
            border: none;
            border-radius: var(--r-pill);
            color: var(--ink-soft);
            font-family: var(--font-ui);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
            position: relative;
            transition: color 0.25s ease, background 0.25s ease;
        }

        .control-btn svg {
            width: 15px;
            height: 15px;
            stroke: currentColor;
            stroke-width: 1.6;
        }

        .control-btn:hover {
            color: var(--on-accent);
            background: var(--gold);
        }

        .menu-btn {
            width: 32px;
            height: 32px;
            padding: 0;
            display: grid;
            place-items: center;
            background: none;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.25s ease;
        }

        .menu-btn:hover {
            background: var(--gold-soft);
        }

        .menu-btn-lines {
            width: 17px;
            height: 11px;
            position: relative;
        }

        .menu-btn-lines span {
            position: absolute;
            left: 0;
            width: 100%;
            height: 1.5px;
            background: var(--ink);
            transition: all 0.35s var(--ease-out);
        }

        .menu-btn-lines span:nth-child(1) {
            top: 0;
        }

        .menu-btn-lines span:nth-child(2) {
            top: 50%;
            transform: translateY(-50%);
            width: 62%;
        }

        .menu-btn-lines span:nth-child(3) {
            bottom: 0;
        }

        .menu-btn.is-open .menu-btn-lines span {
            background: var(--gold);
        }

        .menu-btn.is-open .menu-btn-lines span:nth-child(1) {
            top: 50%;
            transform: translateY(-50%) rotate(45deg);
        }

        .menu-btn.is-open .menu-btn-lines span:nth-child(2) {
            opacity: 0;
        }

        .menu-btn.is-open .menu-btn-lines span:nth-child(3) {
            bottom: 50%;
            transform: translateY(50%) rotate(-45deg);
        }

        /* ═══ DROPDOWN ══════════════════════════════════ */
        .dropdown-menu {
            position: fixed;
            top: calc(var(--bar) + 8px);
            right: 12px;
            z-index: 10001;
            width: 288px;
            background: var(--surface-2);
            border: 1px solid var(--hair);
            border-radius: var(--r-lg);
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            padding: 0;
            opacity: 0;
            transform: translateY(-6px);
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s var(--ease-out);
        }

        .dropdown-menu.is-open {
            opacity: 1;
            transform: none;
            pointer-events: auto;
        }

        .dropdown-header {
            padding: 18px 20px 14px;
            border-bottom: 1px solid var(--hair);
        }

        .dropdown-header-label {
            font-size: 8.5px;
            font-weight: 600;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--gold);
        }

        .dropdown-header-title {
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 600;
            color: var(--ink);
            margin-top: 4px;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 14px 20px;
            text-decoration: none;
            color: var(--ink);
            font-family: var(--font-ui);
            border-bottom: 1px solid var(--hair-soft);
            transition: background 0.22s ease;
        }

        .dropdown-item:last-child {
            border-bottom: none;
        }

        .dropdown-item:hover {
            background: var(--gold-soft);
        }

        .dropdown-item-icon {
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            flex-shrink: 0;
            border: 1px solid var(--hair);
            border-radius: 50%;
            transition: border-color 0.22s ease, background 0.22s ease;
        }

        .dropdown-item:hover .dropdown-item-icon {
            border-color: var(--gold);
            background: var(--surface-1);
        }

        .dropdown-item-icon svg {
            width: 14px;
            height: 14px;
            stroke: var(--gold);
            stroke-width: 1.6;
        }

        .dropdown-item-text {
            flex: 1;
        }

        .dropdown-item-title {
            display: block;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.01em;
        }

        .dropdown-item-sub {
            display: block;
            font-size: 8.5px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-top: 3px;
        }

        .dropdown-item-arrow {
            stroke: var(--ink-faint);
            opacity: 0;
            transition: all 0.22s ease;
        }

        .dropdown-item:hover .dropdown-item-arrow {
            stroke: var(--gold);
            opacity: 1;
            transform: translateX(3px);
        }

        /* ═══ LEFT PANEL — RESIDENCES ═══════════════════ */
        .left-panel {
            position: fixed;
            top: calc(var(--bar) + 74px);
            left: 20px;
            z-index: 9000;
            width: 258px;
            background: var(--surface-2);
            border: 1px solid var(--hair);
            border-radius: var(--r-lg);
            overflow: hidden;
            box-shadow: var(--shadow-md);
            opacity: 0;
            animation: fade-in 0.7s var(--ease-out) 0.35s forwards;
        }

        @keyframes fade-in {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .panel-header {
            padding: 15px 18px 13px;
            border-bottom: 1px solid var(--hair);
        }

        .panel-label {
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--ink-dim);
        }

        .property-type {
            display: grid;
            grid-template-columns: 20px 1fr auto;
            align-items: center;
            gap: 13px;
            padding: 14px 18px;
            text-decoration: none;
            border-bottom: 1px solid var(--hair-soft);
            position: relative;
            transition: background 0.22s ease, padding-left 0.25s var(--ease-out);
        }

        .property-type:last-child {
            border-bottom: none;
        }

        .property-type::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--gold);
            transform: scaleY(0);
            transition: transform 0.25s var(--ease-out);
        }

        .property-type:hover {
            background: var(--gold-soft);
            padding-left: 22px;
        }

        .property-type:hover::before {
            transform: scaleY(1);
        }

        .pt-index {
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.1em;
            color: var(--ink-faint);
            transition: color 0.22s ease;
        }

        .property-type:hover .pt-index {
            color: var(--gold);
        }

        .pt-text {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
        }

        .pt-name {
            font-family: var(--font-display);
            font-size: 17px;
            font-weight: 600;
            color: var(--ink);
            line-height: 1.1;
            letter-spacing: 0.01em;
        }

        .pt-sub {
            font-size: 8.5px;
            font-weight: 500;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .property-type:hover .pt-sub {
            color: var(--gold-light);
        }

        .pt-arrow {
            opacity: 0;
            transform: translateX(-4px);
            transition: all 0.25s var(--ease-out);
        }

        .pt-arrow svg {
            width: 14px;
            height: 14px;
            stroke: var(--gold);
            stroke-width: 1.8;
        }

        .property-type:hover .pt-arrow {
            opacity: 1;
            transform: none;
        }

        /* ═══ BACK BUTTON (#closeCard) — sits clear of the topbar ═══ */
        .close-btn {
            position: fixed !important;
            top: calc(var(--bar) + 18px) !important;
            left: 20px !important;
            right: auto !important;
            bottom: auto !important;
            width: 40px !important;
            height: 40px !important;
            padding: 0 !important;
            margin: 0 !important;
            z-index: 9500;
            display: grid;
            place-items: center;
            background: var(--surface-2);
            color: var(--ink);
            border: 1px solid var(--hair) !important;
            border-radius: 50% !important;
            box-shadow: var(--shadow-md);
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            transition: background 0.22s ease, color 0.22s ease, border-color 0.22s ease;
        }

        .close-btn:hover {
            background: var(--gold);
            color: var(--on-accent);
            border-color: var(--gold) !important;
        }

        /* ═══ UI HINT — keep it below the topbar ════════ */
        #ui-hint,
        .ui-hint {
            top: calc(var(--bar) + 18px) !important;
            bottom: auto !important;
            border-radius: var(--r-pill) !important;
        }

        /* ═══ BOTTOM NAV ════════════════════════════════ */
        .jumpbar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 11000;
            display: flex;
            align-items: stretch;
            height: var(--foot);
            background: var(--surface-2);
            border: 1px solid var(--hair);
            border-radius: var(--r-pill);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            opacity: 0;
            animation: fade-up 0.7s var(--ease-out) 0.45s forwards;
        }

        @keyframes fade-up {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateX(-50%);
            }
        }

        .jumpbar-nav {
            display: flex;
            align-items: stretch;
        }

        .jumpbar-item {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 0 22px;
            text-decoration: none;
            color: var(--ink-soft);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            border-right: 1px solid var(--hair-soft);
            white-space: nowrap;
            position: relative;
            transition: color 0.22s ease, background 0.22s ease;
        }

        .jumpbar-item:last-child {
            border-right: none;
        }

        .jumpbar-item svg {
            width: 15px;
            height: 15px;
            stroke: currentColor;
            stroke-width: 1.6;
        }

        .jumpbar-item:hover {
            color: var(--gold);
            background: var(--gold-soft);
        }

        .jumpbar-item.is-active,
        .jumpbar-item.is-active:hover {
            color: var(--on-accent);
            background: var(--gold);
            border-radius: var(--r-pill);
            border-right-color: transparent;
            margin: 5px 3px;
            padding: 0 19px;
        }

        .jumpbar-ripple {
            display: none;
        }

        /* ═══ ENQUIRY TAB ═══════════════════════════════ */
        .enquiry-btn {
            position: fixed;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10001;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            padding: 22px 12px;
            border-radius: var(--r-lg) 0 0 var(--r-lg);
            background: var(--gold);
            color: var(--on-accent);
            font-family: var(--font-ui);
            font-weight: 600;
            font-size: 10px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.25s ease, padding 0.25s var(--ease-out);
        }

        .enquiry-btn:hover {
            background: var(--gold-dark);
            padding: 26px 12px;
        }

        @media (max-width: 600px) {
            .enquiry-btn {
                font-size: 9px;
                padding: 16px 9px;
                letter-spacing: 0.2em;
            }
        }

        /* ═══ ENQUIRY MODAL ═════════════════════════════ */
        .enquiry .overlay {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: flex-end;
            background: rgba(4, 18, 13, 0);
            z-index: 99999;
            pointer-events: none;
            transition: background 0.35s ease;
        }

        .enquiry .overlay.is-open {
            background: rgba(4, 18, 13, 0.45);
            pointer-events: auto;
        }

        .enquiry .modal {
            width: min(390px, 100vw);
            height: 100%;
            background: var(--surface-2);
            border-left: 1px solid var(--hair);
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
        }

        .enquiry .overlay.is-open .modal {
            transform: none;
        }

        .enquiry .modal-header {
            padding: 0 8px 0 22px;
            height: var(--bar);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--hair);
        }

        .enquiry .modal-header .title {
            flex: 1;
            color: var(--ink);
            font-weight: 500;
            font-size: 11px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            font-family: var(--font-ui);
        }

        .enquiry .close {
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            display: grid;
            place-items: center;
            border: 1px solid var(--hair);
            border-radius: 50%;
            background: none;
            color: var(--ink-mid);
            cursor: pointer;
            font-size: 14px;
            transition: all 0.22s ease;
        }

        .enquiry .close:hover {
            background: var(--gold);
            color: var(--on-accent);
            border-color: var(--gold);
        }

        .enquiry .modal-body {
            padding: 24px 22px;
            overflow-y: auto;
            flex: 1;
        }

        .enquiry .form {
            display: grid;
            gap: 10px;
            width: 100%;
            box-sizing: border-box;
        }

        .enquiry .input,
        .enquiry .select,
        .enquiry .phone {
            width: 100%;
            box-sizing: border-box;
            background: var(--surface-1);
            border: 1px solid var(--hair);
            border-radius: var(--r);
            padding: 13px 14px;
            font-size: 13px;
            color: var(--ink);
            font-family: var(--font-ui);
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .enquiry .input:focus,
        .enquiry .select:focus {
            outline: none;
            border-color: var(--gold);
            background: var(--surface-2);
        }

        .enquiry .input::placeholder {
            color: var(--ink-faint);
        }

        .enquiry .select {
            appearance: none;
            cursor: pointer;
            color: var(--ink-mid);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18"><path d="M7 10l5 5 5-5" fill="none" stroke="%231C5A44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>');
            background-repeat: no-repeat;
            background-position: right 12px center;
        }

        .enquiry .phone {
            display: flex;
            padding: 0;
        }

        .enquiry .phone select {
            appearance: none;
            border: none;
            border-right: 1px solid var(--hair);
            padding: 0 11px;
            min-width: 68px;
            background: transparent;
            color: var(--ink-mid);
            font-size: 13px;
            font-family: var(--font-ui);
            cursor: pointer;
        }

        .enquiry .phone input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 13px 14px;
            font-size: 13px;
            color: var(--ink);
            font-family: var(--font-ui);
        }

        .enquiry .phone input::placeholder {
            color: var(--ink-faint);
        }

        .enquiry .phone input:focus {
            outline: none;
        }

        .enquiry .submit {
            width: 100%;
            border: none;
            border-radius: var(--r);
            padding: 15px;
            font-weight: 600;
            font-size: 10px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            background: var(--gold);
            color: var(--on-accent);
            cursor: pointer;
            margin-top: 6px;
            font-family: var(--font-ui);
            transition: background 0.25s ease;
        }

        .enquiry .submit:hover {
            background: var(--gold-dark);
        }

        .call-btn {
            display: block;
            width: 100%;
            text-align: center;
            padding: 14px 8px;
            border-radius: var(--r);
            font-weight: 600;
            font-size: 10px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            text-decoration: none;
            background: none;
            color: var(--gold);
            border: 1px solid var(--gold);
            transition: all 0.25s ease;
            box-sizing: border-box;
        }

        .call-btn:hover {
            background: var(--gold);
            color: var(--on-accent);
        }

        @media (max-width: 560px) {
            .enquiry .modal {
                width: 100vw;
            }
        }

        /* ═══ MOBILE PANEL TOGGLE ═══════════════════════ */
        .panel-toggle-btn {
            display: none;
        }

        /* ═══ CHROME / MISC ═════════════════════════════ */
        .dock-wrap {
            display: none !important;
        }

        .ambient-particles {
            display: none;
        }

        ::selection {
            background: var(--gold);
            color: var(--on-accent);
        }

        ::-webkit-scrollbar {
            width: 3px;
            height: 3px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--hair);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--gold);
        }

        /* ═══ GALLERY LIGHTBOX ══════════════════════════ */
        .gallery-overlay {
            position: fixed;
            inset: 0;
            z-index: 13000;
            background: rgba(4, 18, 13, 0.96);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .gallery-overlay.is-open {
            opacity: 1;
            pointer-events: auto;
        }

        .gallery-close,
        .walkthrough-close {
            position: absolute;
            top: 18px;
            right: 18px;
            width: 40px;
            height: 40px;
            border: 1px solid rgba(251, 247, 236, 0.22);
            border-radius: 50%;
            background: none;
            color: #FBF7EC;
            font-size: 16px;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: background 0.22s ease;
            z-index: 2;
        }

        .gallery-close:hover,
        .walkthrough-close:hover {
            background: rgba(251, 247, 236, 0.1);
        }

        .gallery-counter {
            position: absolute;
            top: 22px;
            left: 24px;
            font-family: var(--font-ui);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.25em;
            color: rgba(251, 247, 236, 0.65);
            z-index: 2;
        }

        .gallery-main {
            position: relative;
            width: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 76px 116px;
            box-sizing: border-box;
        }

        .gallery-main img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: var(--r-lg);
        }

        .gallery-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            border: 1px solid rgba(251, 247, 236, 0.18);
            border-radius: 50%;
            background: none;
            color: #FBF7EC;
            font-size: 18px;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: all 0.22s ease;
            z-index: 2;
        }

        .gallery-nav:hover {
            background: rgba(251, 247, 236, 0.1);
            border-color: rgba(251, 247, 236, 0.4);
        }

        .gallery-prev {
            left: 20px;
        }

        .gallery-next {
            right: 20px;
        }

        .gallery-thumbs {
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 2;
            max-width: 90vw;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .gallery-thumbs::-webkit-scrollbar {
            display: none;
        }

        .gallery-thumb {
            width: 56px;
            height: 38px;
            overflow: hidden;
            border: 1px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            flex-shrink: 0;
            opacity: 0.4;
            transition: all 0.22s ease;
        }

        .gallery-thumb.is-active {
            border-color: var(--brass);
            opacity: 1;
        }

        .gallery-thumb:hover {
            opacity: 0.8;
        }

        .gallery-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ═══ WALKTHROUGH ═══════════════════════════════ */
        .walkthrough-overlay {
            position: fixed;
            inset: 0;
            z-index: 13000;
            background: rgba(4, 18, 13, 0.97);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .walkthrough-overlay.is-open {
            opacity: 1;
            pointer-events: auto;
        }

        .walkthrough-video-wrap {
            width: 90vw;
            max-width: 1000px;
            aspect-ratio: 16/9;
            border: 1px solid rgba(251, 247, 236, 0.14);
            border-radius: var(--r-lg);
            overflow: hidden;

        .walkthrough-video-wrap video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #04120D;
        }

        @media (max-width: 900px) {

            .panel-toggle-btn {

            .panel-toggle-btn svg {

            }

            .panel-toggle-btn.is-open svg {

            .left-panel {

            }

            .left-panel.is-open {

                pointer-events: auto;

            }

            .panel-header {
                display: none;
            }

                gap: 11px;
            }

            .property-type:hover {
                padding-left: 16px;
            }

            .pt-name {
                font-size: 15px;
            }

            .pt-sub {
                font-size: 8px;
            }

            /* Bottom nav: full-width, edge to edge */
            .jumpbar {
                left: 0;
                right: 0;
                bottom: 0;
                transform: none;
                border-left: none;
                border-right: none;
                border-bottom: none;
                border-radius: var(--r-lg) var(--r-lg) 0 0;
            }

            @keyframes fade-up {
                from {

                    transform: translateY(10px);

                to {
                    opacity: 1;
                    transform: none;
                }

            .jumpbar-nav {
                width: 100%;
            }

            .jumpbar-item {
                flex: 1;
                justify-content: center;
                flex-direction: column;
                gap: 4px;
                padding: 0 4px;
                font-size: 8px;
                letter-spacing: 0.1em;
            }

            .jumpbar-item svg {
                width: 16px;
                height: 16px;
            }

            .gallery-main {
                padding: 66px 14px 96px;
            }

            .gallery-nav {
                width: 34px;
                height: 34px;
                font-size: 15px;
            }

            .gallery-prev {
                left: 8px;
            }

            .gallery-next {
                right: 8px;
            }

            .gallery-thumb {
                width: 42px;
                height: 30px;
            }

            .gallery-counter {
                top: 26px;
                left: 16px;
            }

            .gallery-close,
            .walkthrough-close {
                top: 12px;
                right: 12px;
                width: 36px;
                height: 36px;
            }

            .close-btn {
                top: calc(var(--bar) + 12px) !important;
                left: 12px !important;
                width: 36px !important;
                height: 36px !important;
            }

            #ui-hint,
            .ui-hint {
                top: calc(var(--bar) + 12px) !important;
            }
        }

        @media (max-width: 420px) {
            .tb-name {
                font-size: 16px;
            }

            .tb-rule,
            .tb-mark {
                display: none;
            }

            .jumpbar-item {
                font-size: 7.5px;
            }
        }
    </style>

    <script>
        // Hamburger Dropdown Menu
        (function () {
            const menuBtn = document.getElementById('menuBtn');
            const dropdown = document.getElementById('dropdownMenu');
            if (!menuBtn || !dropdown) return;
            function openMenu() {
                menuBtn.classList.add('is-open'); dropdown.classList.add('is-open');
                menuBtn.setAttribute('aria-expanded', 'true'); dropdown.setAttribute('aria-hidden', 'false');
            }
            function closeMenu() {
                menuBtn.classList.remove('is-open'); dropdown.classList.remove('is-open');
                menuBtn.setAttribute('aria-expanded', 'false'); dropdown.setAttribute('aria-hidden', 'true');
            }
            menuBtn.addEventListener('click', (e) => { e.stopPropagation(); menuBtn.classList.contains('is-open') ? closeMenu() : openMenu(); });
            document.addEventListener('click', (e) => { if (!dropdown.contains(e.target) && !menuBtn.contains(e.target)) closeMenu(); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });
        })();
    </script>

    <script>
        // Jumpbar Click Ripple & Active State
        (function () {
            const items = document.querySelectorAll('.jumpbar-item');
            items.forEach(item => {
                item.addEventListener('click', function (e) {
                    items.forEach(i => i.classList.remove('is-active'));
                    this.classList.add('is-active');
                    const ripple = document.createElement('span');
                    ripple.className = 'jumpbar-ripple';
                    const rect = this.getBoundingClientRect();
                    const size = Math.max(rect.width, rect.height);
                    ripple.style.width = ripple.style.height = size + 'px';
                    ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
                    ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
                    this.appendChild(ripple);
                    ripple.addEventListener('animationend', () => ripple.remove());
                });
            });
        })();
    </script>

    <!-- ═══ GALLERY + WALKTHROUGH SCRIPTS (ADDED) ═══ -->
    <script>
        // Gallery Lightbox
        (function () {
            const images = [
                'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=1200&q=80',
                'https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=1200&q=80',
                'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=1200&q=80',
                'https://images.unsplash.com/photo-1613490493576-7fde63acd811?w=1200&q=80',
                'https://images.unsplash.com/photo-1512917774080-9991f1c4c750?w=1200&q=80',
                'https://images.unsplash.com/photo-1600566753376-12c8ab7a5a1e?w=1200&q=80'
            ];
            let idx = 0;
            const overlay = document.getElementById('galleryOverlay');
            const img = document.getElementById('galleryImage');
            const counter = document.getElementById('galleryCurrent');
            const total = document.getElementById('galleryTotal');
            const thumbsWrap = document.getElementById('galleryThumbs');
            if (!overlay || !img) return;
            total.textContent = images.length;

            // Build thumbs
            images.forEach((src, i) => {
                const t = document.createElement('div');
                t.className = 'gallery-thumb' + (i === 0 ? ' is-active' : '');
                t.innerHTML = '<img src="' + src.replace('w=1200', 'w=120') + '" alt="">';
                t.addEventListener('click', () => goTo(i));
                thumbsWrap.appendChild(t);
            });

            function goTo(i) {
                idx = i; img.src = images[idx]; counter.textContent = idx + 1;
                thumbsWrap.querySelectorAll('.gallery-thumb').forEach((t, j) => t.classList.toggle('is-active', j === idx));
            }
            function open() { overlay.classList.add('is-open'); goTo(idx); }
            function close() { overlay.classList.remove('is-open'); }

            document.getElementById('galleryPrev').addEventListener('click', () => goTo((idx - 1 + images.length) % images.length));
            document.getElementById('galleryNext').addEventListener('click', () => goTo((idx + 1) % images.length));
            document.getElementById('galleryClose').addEventListener('click', close);
            overlay.addEventListener('click', e => { if (e.target === overlay) close(); });

            // Wire all gallery buttons
            document.querySelectorAll('[data-open-gallery]').forEach(btn => {
                btn.addEventListener('click', e => { e.preventDefault(); open(); });
            });
            // Keyboard
            document.addEventListener('keydown', e => {
                if (!overlay.classList.contains('is-open')) return;
                if (e.key === 'Escape') close();
                if (e.key === 'ArrowLeft') goTo((idx - 1 + images.length) % images.length);
                if (e.key === 'ArrowRight') goTo((idx + 1) % images.length);
            });
        })();
    </script>
    <script>

            function close() { overlay.classList.remove('is-open'); video.pause(); video.currentTime = 0; }
            document.getElementById('walkthroughClose').addEventListener('click', close);
            overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
            document.querySelectorAll('[data-open-walkthrough]').forEach(btn => {
                btn.addEventListener('click', e => { e.preventDefault(); open(); });
            });
            document.addEventListener('keydown', e => { if (e.key === 'Escape' && overlay.classList.contains('is-open')) close(); });
        })();
    </script>

    <script>
        // FortmenTownsquare - Tower B floor navigation (robust click handler)
        document.addEventListener('DOMContentLoaded', function () {
            const svg = document.querySelector('.Cutout svg');
            if (!svg) return;

            // Explicitly restore clickability. The SVG itself must not block its paths.
            svg.style.pointerEvents = 'auto';
            document.querySelectorAll('.Cutout path[data-link]').forEach(function (path) {
                path.style.pointerEvents = 'all';
                path.style.cursor = 'pointer';
            });

            svg.addEventListener('click', function (event) {
                const path = event.target && event.target.closest ? event.target.closest('path[data-link]') : null;
                if (!path || !svg.contains(path)) return;

                event.preventDefault();
                event.stopPropagation();

                const floor = path.getAttribute('floorNumber') ||
                    (path.getAttribute('data-name') || '').match(/(\d+)/)?.[1];
                const link = path.getAttribute('data-link');
                if (!floor || !link) return;

                sessionStorage.setItem('selectedTower', '11');
                sessionStorage.setItem('selectedFloor', String(floor));
                sessionStorage.setItem('fortmenTownsquareTower', '11');
                sessionStorage.setItem('fortmenTownsquareFloor', String(floor));

                const separator = link.includes('?') ? '&' : '?';
                window.location.assign(link + separator + 'floor=' + encodeURIComponent(String(floor)));
            }, true);
        });
    </script>
