@import url('https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap');

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Jost', sans-serif;
}

#viewer {
    width: 100%;
    height: 100%;
}

/* =========================================
   FADE
========================================= */

#fadeOverlay {
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity .45s ease;
    z-index: 99999;
}


/* =========================================
   BACK BUTTON
========================================= */

#backBtn {
    position: fixed;
    top: 24px;
    left: 24px;
    z-index: 10000;

    width: 46px;
    height: 46px;

    border: 1px solid rgba(255,255,255,.20);
    border-radius: 50%;

  background: rgba(30,48,43,.82);
    color: #fff;

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    box-shadow:
        0 8px 30px rgba(0,0,0,.25),
        inset 0 1px 0 rgba(255,255,255,.08);

    transition:
        background .25s ease,
        transform .25s ease,
        border-color .25s ease;
}

#backBtn:hover {
    background: rgba(255,255,255,.92);
    color: #111;
    border-color: rgba(255,255,255,.5);
    transform: translateX(-2px);
}

#backBtn svg {
    width: 19px;
    height: 19px;
}


/* =========================================
   ROOM INFORMATION
========================================= */


/* =========================================
   BOTTOM ROOM NAVIGATION
========================================= */

.tour-nav-wrap {
    position: fixed;

    left: 50%;
    bottom: 22px;

    transform: translateX(-50%);

    z-index: 10000;

    display: flex;
    align-items: center;

    width: auto;
    max-width: calc(100vw - 40px);
}

.tour-nav {
    display: flex;
    align-items: center;

    gap: 4px;

    padding: 7px;

    background: rgba(30,48,43,.82);

    border: 1px solid rgba(255,255,255,.16);
    border-radius: 18px;

    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);

    box-shadow:
        0 15px 50px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.07);

    overflow-x: auto;
    scrollbar-width: none;
}

.tour-nav::-webkit-scrollbar {
    display: none;
}


/* =========================================
   ROOM BUTTONS
========================================= */

.tour-pill {
    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 8px;

    height: 40px;
    padding: 0 15px;

    border: 1px solid transparent;
    border-radius: 12px;

    background: transparent;
    color: rgba(245,242,234,.68);

    font-family: 'Jost', sans-serif;
    font-size: 13px;
    font-weight: 600;

    letter-spacing: .025em;

    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;

    transition:
        background .25s ease,
        color .25s ease,
        transform .25s ease,
        border-color .25s ease;
}

.tour-pill svg {
    width: 16px;
    height: 16px;

    flex-shrink: 0;

    opacity: .72;

    transition:
        opacity .25s ease,
        transform .25s ease;
}

.tour-pill:hover {
    color: #fff;
    background: rgba(245,242,234,.10);

    transform: translateY(-1px);
}

.tour-pill:hover svg {
    opacity: 1;
}

.tour-pill.active {
    background: #E8E3D9;
    color: #1E302B;


    border-color: rgba(255,255,255,.5);

    box-shadow:
        0 5px 18px rgba(0,0,0,.2),
        inset 0 1px 0 rgba(255,255,255,.5);
}

.tour-pill.active svg {
    opacity: 1;
}

   ROOM INFO — HIGH READABILITY VERSION
========================================= */

#roomInfoCard {

    position: fixed !important;

    top: 24px !important;
    right: 24px !important;
    left: auto !important;

    width: 225px !important;
    min-width: 185px !important;
    max-width: 185px !important;

    padding: 12px 16px !important;

    background: #1E302B !important;

    border: 1px solid #AFA99E !important;
    border-radius: 8px !important;

        0 10px 30px rgba(0,0,0,.45) !important;

    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;

    text-align: left !important;

    opacity: 0 !important;
    transform: translateY(-8px) !important;

    transition:
        opacity .35s ease,
        transform .35s ease !important;
}


#roomInfoCard.visible {
    opacity: 1 !important;
    transform: translateY(0) !important;
}


/* ROOM NAME */

#roomInfoCard .hud-name {
    display: block !important;

    margin: 0 0 4px !important;
    padding: 0 !important;

    color: #FFFFFF !important;

    font-size: 24px !important;
    line-height: 1.1 !important;
    font-weight: 600 !important;

    letter-spacing: 0 !important;
}


/* DIMENSIONS */

#roomInfoCard .hud-dims {
    display: flex !important;
    align-items: center !important;

    gap: 5px !important;

    margin: 0 !important;
    padding: 0 !important;

    color: #F5F2EA !important;

    font-size: 14px !important;
    line-height: 1.2 !important;
    font-weight: 500 !important;

    letter-spacing: 0 !important;
    white-space: nowrap !important;
}

#roomInfoCard .hud-dims > span {
    display: inline-block !important;
    margin: 0 !important;
    padding: 0 !important;
}

#roomInfoCard .hud-multiply {
    opacity: .72;
    margin: 0 !important;
}


/* SQ FT */

#roomInfoCard .hud-sqft {
    display: block !important;

    margin: 0 !important;
    padding: 0 !important;

    color: #D8D3C9 !important;

    font-size: 19px !important;
    line-height: 1.2 !important;
    font-weight: 500 !important;

    letter-spacing: .12em !important;

    text-transform: uppercase !important;
}


/* FT */

#roomInfoCard .hud-accent {
    color: #E8E3D9 !important;
}
/* =========================================
   MOBILE
========================================= */

@media (max-width: 768px) {

    #roomInfoCard {
        top: 14px !important;
        right: 14px !important;

        padding: 14px 16px !important;

        border-radius: 7px !important;
    }

    #roomInfoCard .hud-name {

    }

    #roomInfoCard .hud-dims {

        margin-bottom: 5px !important;
    }

    #roomInfoCard .hud-sqft {
        font-size: 8px !important;
    }
}

/* =========================================
   SCROLL ARROW
========================================= */

.scroll-arrow {
    display: none;

    align-items: center;
    justify-content: center;

    width: 36px;
    height: 40px;

    margin-left: 5px;

    flex-shrink: 0;

    border: 1px solid rgba(255,255,255,.16);
    border-radius: 12px;

    background: rgba(12,12,12,.55);
    color: #fff;

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    pointer-events: none;

    transition: opacity .3s ease;
}

.scroll-arrow svg {
    width: 15px;
    height: 15px;
}

.scroll-arrow.hidden {
    opacity: 0;
}


/* =========================================
   BALCONY / FLOOR CONTROL
========================================= */

#balconyControls {
    position: fixed;

    top: 50%;
    right: 24px;

    transform: translateY(-50%);

    z-index: 10001;

    display: none;

    flex-direction: column;
    align-items: center;

    padding: 5px;

background: rgba(18,35,30,.94);
    border: 1px solid rgba(255,255,255,.17);
    border-radius: 17px;

    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);

    box-shadow:
        0 12px 40px rgba(0,0,0,.3),
        inset 0 1px 0 rgba(255,255,255,.07);

    overflow: hidden;
}

#balconyControls .floor-btn {
    width: 42px;
    height: 42px;

    border: 0;
    border-radius: 12px;

    background: transparent;
    color: rgba(255,255,255,.72);

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    transition:
        background .2s ease,
        color .2s ease,
        transform .2s ease;
}

#balconyControls .floor-btn:hover {
    background: rgba(255,255,255,.10);
    color: #fff;

    transform: scale(1.04);
}

#balconyControls .floor-btn:active {
    transform: scale(.94);
}

#balconyControls .floor-btn svg {
    width: 17px;
    height: 17px;
}

#floorIndicator {
    width: 42px;

    padding: 9px 0;

    border-top: 1px solid rgba(255,255,255,.10);
    border-bottom: 1px solid rgba(255,255,255,.10);

    color: #fff;

    font-family: 'Jost', sans-serif;
    font-size: 9px;
    font-weight: 500;

    line-height: 1.45;
    letter-spacing: .12em;

    text-align: center;
    text-transform: uppercase;
}


/* =========================================
   DESKTOP
========================================= */

@media (min-width: 769px) {

    .tour-nav-wrap {

    }

    .tour-nav-wrap .tour-nav {

        transform: none !important;

    }

/* =========================================
   MOBILE

        font-size: 12px;
    }

    .tour-pill svg {
        width: 15px;
        height: 15px;
    }

    .scroll-arrow {
        display: flex;
    }


    #balconyControls {
        right: 12px;
    }

    #balconyControls .floor-btn {

        height: 39px;
    }

    }

========================================= */

@media (max-width: 400px) {

    }

    #roomInfoCard .hud-dims {

    }

    .tour-pill {

    }
}

   REQUEST TO HOLD BUTTON
========================================= */

#holdRequestBtn {
    position: fixed;
    right: 24px;
    bottom: 94px;

    z-index: 10002;

    height: 46px;
    padding: 0 22px;

    border: 1px solid rgba(255,255,255,.35);

}

    width: 17px;

}

#holdRequestBtn:hover {
    background: #1E302B;

    box-shadow:
        0 14px 35px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.08);
}

#holdRequestBtn:active {
    transform: translateY(0) scale(.98);
}


/* =========================================
   HOLD REQUEST OVERLAY
========================================= */

#holdOverlay {
    position: fixed;
    inset: 0;

    z-index: 20000;

    display: none;
    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(0,0,0,.58);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}

#holdOverlay.show {
    display: flex;
}


/* =========================================
   HOLD FORM CARD
========================================= */

#holdCard {
    position: relative;

    width: 430px;
    max-width: 100%;

    padding: 30px;

    background: #1E302B;

    border: 1px solid #AFA99E;
    border-radius: 14px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.08);

    color: #F5F2EA;

    animation: holdCardIn .3s ease;
}

@keyframes holdCardIn {
    from {
        opacity: 0;
        transform: translateY(15px) scale(.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}


/* =========================================
   CLOSE BUTTON
========================================= */

#holdClose {
    position: absolute;

    top: 14px;
    right: 14px;

    width: 34px;
    height: 34px;

    border: 1px solid rgba(255,255,255,.18);
    border-radius: 10px;

    background: rgba(255,255,255,.06);
    color: #F5F2EA;

    display: flex;
    align-items: center;
    justify-content: center;

    transition: .25s ease;
}

#holdClose:hover {

    color: #1E302B;
}

#holdClose svg {
    width: 16px;

}

}

}

@media (max-width: 768px) {
